<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Engine invariants tests</title>
<pre id="results">Running...</pre>
<script>
window.fetch = () => { throw new Error('Outbound network blocked by engine invariant tests (QA-0.4)'); };
</script>
<script src="../js/config.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/bagrutFacts.js"></script>
<script src="../js/bagrutPolicies.js"></script>
<script src="../js/bagrutEngine.js"></script>
<script src="../js/bagrutAdvisor.js"></script>
<script src="../js/groupAnalyzer.js"></script>
<script>
(async () => {
  const results = document.getElementById('results');
  const outcome = [];
  let active = null, section = '';

  /* assertions never throw: every failure is collected so one run lists all gaps */
  const check = (condition, message) => { if (!condition) active.failures.push(`${section ? section + ': ' : ''}${message}`); };
  const same = (actual, expected, message) => check(JSON.stringify(actual) === JSON.stringify(expected), `${message} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
  const near = (actual, expected, message) => check(typeof actual === 'number' && Math.abs(actual - expected) < 1e-9, `${message} (expected ${expected}, got ${actual})`);
  const part = async (id, fn) => {
    section = id;
    try { await fn(); } catch (e) { active.failures.push(`${id}: EXCEPTION ${e && e.stack ? e.stack : e}`); }
    section = '';
  };
  const group = async (title, fn) => {
    active = { title, failures: [] };
    outcome.push(active);
    try { await fn(); } catch (e) { active.failures.push(`EXCEPTION ${e && e.stack ? e.stack : e}`); }
  };

  /* ---------- synthetic data helpers (100% invented IDs and names) ---------- */
  const T = n => String(900000000 + n);
  const stu = (n, grade, homeroom, extra = {}) => ({ tz: T(n), firstName: 'חניך' + n, lastName: 'בדיקה', grade, homeroom, track: 'רגילה', ...extra });
  const BAGRUT_MAP = { tz: 'tz', subject: 'subject', questionnaireCode: 'code', finalGrade: 'final', examGrade: 'exam', submissionGrade: 'sub', moed: 'moed' };
  const GROUP_MAP = { tz: 'tz', grade: 'grade', classNum: 'cls', groupId: 'gid', isTeacher: 'teacher' };
  const SADIN_MAP = { tz: 'tz', event: 'ev', score: 'sc', group: 'grp', date: 'dt' };
  const bagrutRows = list => Parser.normalize('bagrut', list, BAGRUT_MAP).rows;
  const groupRows = list => Parser.normalize('groups', list, GROUP_MAP).rows;
  const sadinRows = list => Parser.normalize('grades', list, SADIN_MAP).rows;

  /* a fully eligible 12th grader: every core subject, a 5-unit physics major and all internal units */
  const BASE = {
    '22283': 70, '22261': 70, '34221': 70, '34225': 70, '8283': 70, '8281': 70, '1263': 70, '1264': 70, '11283': 70, '11281': 70,
    '16382': 80, '16471': 80, '16483': 80, '16486': 80, '35471': 80, '35472': 80, '36361': 80,
    '86083': 'עמד בדרישות', '41083': 'בוצע', '43183': 70, '82083': 'בוצע'
  };
  const profile = (tz, changes = {}) => Object.entries({ ...BASE, ...changes }).filter(([, value]) => value !== null)
    .map(([code, value]) => (value !== null && typeof value === 'object' ? { tz, code, ...value } : { tz, code, final: value }));
  const partial = (n, map) => Object.entries(map).map(([code, final]) => ({ tz: T(n), code, final }));

  let saved = null;
  const resetConfig = () => {
    Config.data = Config.defaults();
    Config._activeCohort = Config.data.gradeCohortMap['12'];
    Config._rulesOverride = null;
    Config._syncQuestionnaires();
    Config._cache = {};
    Config._ignoredCache = new Set();
    Config._invalidateRoster();
  };
  const world = ({ roster = [], bagrut = [], groups = [], sadin = [] } = {}) => {
    const norm = Config.normalizeRosterRows(roster);
    const stamp = Date.now();
    const cache = { masterRoster: { data: norm.rows, ignoredIds: norm.ignoredIds, fileName: 'synthetic-roster.xlsx', uploadedAt: stamp } };
    [['bagrutData', bagrut], ['groupsData', groups], ['sadinData', sadin]].forEach(([key, rows]) => {
      if (rows.length) cache[key] = { data: rows, fileName: `synthetic-${key}.xlsx`, uploadedAt: stamp };
    });
    Config._cache = cache;
    Config._ignoredCache = new Set();
    Config._invalidateRoster();
    Store.refresh();
    return norm;
  };
  const solo = (changes = {}, grade = 'יב', homeroom = grade + '1', extra = {}) => {
    world({ roster: [stu(1, grade, homeroom)], bagrut: bagrutRows(profile(T(1), changes)), ...extra });
    return T(1);
  };
  const evalFull = (tz = T(1), opts = {}) => BagrutEngine.evaluate(tz, { fullMode: true, ...opts });
  const subj = (ev, id) => ev.subjects.find(s => s.id === id);
  const kinds = ev => ev.blockers.filter(b => !b.info).map(b => b.k);

  const scan = (value, path, found, seen = new WeakSet()) => {
    if (typeof value === 'number') { if (!Number.isFinite(value)) found.push(`${path}=${value}`); return; }
    if (typeof value === 'string') { if (/\b(NaN|undefined|Infinity)\b/.test(value)) found.push(`${path}="${value}"`); return; }
    if (!value || typeof value !== 'object' || seen.has(value)) return;
    seen.add(value);
    const entries = value instanceof Map ? [...value.entries()] : value instanceof Set ? [...value].map((v, i) => [i, v]) : Object.entries(value);
    entries.forEach(([k, v]) => scan(v, `${path}.${k}`, found, seen));
  };
  const noNaN = (value, label) => { const found = []; scan(value, label, found); check(!found.length, `NaN/undefined/Infinity leaked: ${found.slice(0, 5).join('; ')}`); };

  const rng = seed => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const shuffled = (list, seed) => {
    const next = rng(seed), out = [...list];
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  };

  /* ---------- rich synthetic school: grades 10 / 11 / 12 with every case family ---------- */
  const ELEVENTH = { '22283': 70, '34221': 70, '8283': 70, '1263': 70, '11283': 70, '16382': 70, '35471': 70 };
  const schoolFixture = () => {
    const roster = [], bagrut = [], groups = [], sadin = [];
    const senior = (n, cls, changes) => { roster.push(stu(n, 'יב', cls)); bagrut.push(...bagrutRows(profile(T(n), changes))); };
    senior(1, 'יב1', {});
    senior(2, 'יב1', { '22283': 50, '22261': 50 });
    senior(3, 'יב1', { '22283': 30, '22261': 30, '16382': 75, '16471': 75, '35471': 75, '35472': 75 });
    senior(4, 'יב1', { '11283': 50, '11281': 50 });
    senior(5, 'יב2', { '22283': 30, '22261': 30, '34221': 30, '34225': 30 });
    senior(6, 'יב2', { '22283': null, '22261': 60 });
    senior(7, 'יב2', { '22283': null, '22261': 20 });
    senior(8, 'יב2', { '35571': 80, '35471': 60, '35472': 70 });
    senior(9, 'יב2', { '43183': null, '43351': 80 });
    senior(10, 'יב2', { ...Object.fromEntries(Object.keys(BASE).map(code => [code, null])) });
    senior(11, 'יב2', { '22283': 30, '22261': 30, '34221': 30, '34225': 30, '5384': { final: 70, subject: 'אנגלית' } });
    senior(12, 'יב1', { '22283': 55, '22261': 54 });
    for (let n = 21; n <= 27; n++) { roster.push(stu(n, 'יא', n < 25 ? 'יא1' : 'יא2')); bagrut.push(...bagrutRows(partial(n, ELEVENTH))); }
    roster.push(stu(28, 'יא', 'יא2')); bagrut.push(...bagrutRows(partial(28, { ...ELEVENTH, '16382': null }).filter(r => r.final !== null)));
    roster.push(stu(29, 'יא', 'יא2')); bagrut.push(...bagrutRows(partial(29, { ...ELEVENTH, '16382': null, '35471': null }).filter(r => r.final !== null)));
    roster.push(stu(31, 'י', 'י1'));
    roster.push(stu(32, 'י', 'י1')); bagrut.push(...bagrutRows(partial(32, { '16381': 60, '16382': 60 })));
    roster.push(stu(33, 'י', 'י2')); bagrut.push(...bagrutRows(partial(33, { '16381': 30 })));
    const english = 'אנגלית 4 יח"ל יב1-יב2 דוד בדיקה [7001]', reinforcement = 'תגבור מתמטיקה 5 יח"ל יב1-יב2 מיכל בדיקה [7002]';
    groups.push(...groupRows([1, 2, 3, 4, 5, 6].map(n => ({ tz: T(n), grade: 'יב', cls: n < 5 ? 'יב1' : 'יב2', gid: english }))));
    groups.push(...groupRows([2, 3].map(n => ({ tz: T(n), grade: 'יב', cls: 'יב1', gid: reinforcement }))));
    sadin.push(...sadinRows([[1, 90, 80], [2, 60, 70], [3, 40, 55]].flatMap(([n, a, b]) => [
      { tz: T(n), ev: 'מבחן (50)', sc: a, grp: english, dt: '01/10/2026' }, { tz: T(n), ev: 'בוחן (50)', sc: b, grp: english, dt: '15/10/2026' }
    ])));
    return { roster, bagrut, groups, sadin };
  };

  try {
    await Config.ready;
    saved = {
      data: Config.data, cache: Config._cache, ignored: Config._ignoredCache, active: Config._activeCohort, override: Config._rulesOverride,
      write: Config._write, put: Config._storePut, raw: Store.raw, loaded: Store.loaded
    };
    /* nothing in this page may touch the browser's real localStorage / IndexedDB data */
    Config._write = () => ({ ok: true });
    Config._storePut = async () => ({ ok: true });
    Util.idWarn.sci = 0;
    resetConfig();

    /* ====================================================================
       קבוצה 0 — חסימת רשת (QA-0.4)
       ==================================================================== */
    await group('Group 0 — QA-0.4 all outbound cloud traffic is blocked', async () => {
      await part('QA-0.4', async () => {
        let blocked = false;
        try { window.fetch('https://script.google.com/macros/s/synthetic/exec', { method: 'POST', body: '{}' }); } catch (e) { blocked = /blocked/.test(e.message); }
        check(blocked, 'fetch to script.google.com must throw synchronously');
      });
    });

    /* ====================================================================
       קבוצה A — שלמות נתונים ואינווריאנטים
       QA-1.1, QA-1.2, QA-1.3/INV-1, QA-1.12/INV-2, QA-1.14/INV-10
       ==================================================================== */
    await group('Group A — data integrity: QA-1.1, QA-1.2, QA-1.3/INV-1, QA-1.12/INV-2, QA-1.14/INV-10', async () => {
      resetConfig();
      await part('QA-1.1 roster counts per grade and class; no vanished or duplicated IDs', async () => {
        const spec = [['י', 'י1', 3], ['י', 'י2', 2], ['יא', 'יא1', 3], ['יא', 'יא2', 3], ['יב', 'יב1', 4], ['יב', 'יב2', 3], ['יב', 'יב3', 2]];
        const rows = []; let n = 100;
        spec.forEach(([grade, cls, count]) => { for (let i = 0; i < count; i++) rows.push(stu(++n, grade, cls)); });
        const expectedIds = rows.map(r => r.tz);
        rows[1] = { ...rows[1], tz: ` ${rows[1].tz} ` };
        rows[2] = { ...rows[2], tz: rows[2].tz.slice(0, 3) + '-' + rows[2].tz.slice(3) };
        rows.push({ ...rows[10] });
        rows.push(stu(500, 'ט', 'ט1'));
        rows.push({ ...stu(501, 'יב', 'יב1'), tz: '' });
        const norm = world({ roster: rows });
        check(norm.rows.length === 20 && norm.duplicates === 1 && norm.skipped === 1, `Roster normalisation: ${norm.rows.length} rows, ${norm.duplicates} duplicates, ${norm.skipped} skipped`);
        same(norm.ignoredIds, [T(500)], 'Junior student ID must be remembered only as ignored');
        check(Store.trainees.size === 20, `Store must hold exactly 20 trainees, got ${Store.trainees.size}`);
        same(expectedIds.filter(id => !Store.trainees.has(id)), [], 'Students vanished from the Store');
        const byGrade = {}, byClass = {};
        Store.traineeList().forEach(t => { byGrade[t.gradeKey] = (byGrade[t.gradeKey] || 0) + 1; byClass[t.classKey] = (byClass[t.classKey] || 0) + 1; });
        same(byGrade, { 'י': 5, 'יא': 6, 'יב': 9 }, 'Per-grade counts');
        same(Object.fromEntries(spec.map(([, cls, count]) => [cls, count])), byClass, 'Per-class counts');
        check(new Set(Store.traineeList().map(t => t.tz)).size === Store.trainees.size, 'Duplicate IDs inside the Store');
      });

      await part('QA-1.2 / QA-1.3 INV-1 normId unifies every ID form and is idempotent', async () => {
        const canonical = '012345678';
        const forms = ['12345678', '012345678', ' 12345678 ', '1234-5678', '012-345-678', 12345678, '12345678.0', '012345678.0'];
        forms.forEach(f => check(Util.normId(f) === canonical, `normId(${JSON.stringify(f)}) = ${Util.normId(f)}`));
        const idempotent = [...forms, 'A1234567', 'a-123 4567', '', '   ', null, undefined, 0, 5, '12345678901', '1.23457E+08'];
        idempotent.forEach(f => { const once = Util.normId(f); check(Util.normId(once) === once, `normId not idempotent for ${JSON.stringify(f)}`); });
        Util.idWarn.sci = 0;

        const roster = [{ ...stu(1, 'יב', 'יב1'), tz: ' 12345678 ' }];
        const bagrut = bagrutRows([{ tz: '012-345-678', code: '22283', final: 70 }]);
        const groups = groupRows([{ tz: 12345678, grade: 'יב', cls: 'יב1', gid: 'אנגלית 4 יח"ל יב1 דוד בדיקה [7001]' }]);
        const sadin = sadinRows([{ tz: '12345678.0', ev: 'מבחן (50)', sc: 80, grp: 'אנגלית 4 יח"ל יב1 דוד בדיקה [7001]', dt: '01/10/2026' }]);
        world({ roster, bagrut, groups, sadin });
        same([bagrut[0].tz, groups[0].tz, sadin[0].tz], [canonical, canonical, canonical], 'File rows must carry the canonical ID');
        same(Store.unknown, { groups: [], grades: [], bagrut: [] }, 'No file may leave unmatched IDs');
        const t = Store.trainees.get(canonical);
        check(t && t.inGroups && t.inGrades && t.inBagrut, 'The roster student must be matched in groups, sadin and bagrut files');
      });

      await part('QA-1.12 INV-2 importing the same files twice equals importing once', async () => {
        const rosterRows = [1, 2, 3].map(n => stu(n, 'יב', 'יב1'));
        const gid = 'אנגלית 4 יח"ל יב1 דוד בדיקה [7001]';
        const sets = {
          bagrutData: bagrutRows([
            { tz: T(1), code: '22283', final: 60, moed: 'חורף' }, { tz: T(1), code: '22283', final: 70, moed: 'קיץ' },
            { tz: T(2), code: '22261', final: 80 }, { tz: T(3), code: '36361', final: 90 }
          ]),
          groupsData: groupRows([
            ...[1, 2, 3].map(n => ({ tz: T(n), grade: 'יב', cls: 'יב1', gid })), { tz: '', gid, teacher: 'כן' }
          ]),
          sadinData: sadinRows([1, 2, 3].map(n => ({ tz: T(n), ev: 'מבחן (50)', sc: 60 + n, grp: gid, dt: '01/10/2026' })))
        };
        const snapshot = () => JSON.stringify({
          trainees: Store.traineeList(),
          groups: [...Store.groups.values()].map(g => ({ ...g, members: [...g.members].sort(), gradeMembers: [...g.gradeMembers].sort() })).sort((a, b) => a.groupId.localeCompare(b.groupId)),
          current: [...Store._current.entries()].sort(([a], [b]) => a.localeCompare(b)),
          attempts: Store.traineeList().map(t => Store.attemptsOf(t.tz)), unknown: Store.unknown, missed: Store.missed
        });
        const load = async () => {
          for (const [key, rows] of Object.entries(sets)) check((await Config.upsertDataset(key, rows, { fileName: key + '.xlsx' })).ok, `upsert ${key}`);
          Store.refresh();
          return { snapshot: snapshot(), data: Object.fromEntries(Object.keys(sets).map(key => [key, JSON.stringify(Config.getRows(key))])) };
        };
        world({ roster: rosterRows });
        const once = await load();
        const twice = await load();
        same(Object.keys(sets).map(k => JSON.parse(twice.data[k]).length), Object.keys(sets).map(k => JSON.parse(once.data[k]).length), 'Row counts changed after the second import');
        check(JSON.stringify(once.data) === JSON.stringify(twice.data), 'Stored datasets differ between one and two imports');
        check(once.snapshot === twice.snapshot, 'Store state (grades, events, group placements) differs between one and two imports');
      });

      await part('QA-1.14 INV-10 abnormal grade values', async () => {
        const classes = { 'לא נבחן': 'none', 'טקסט חופשי': 'none', 'פטור': 'pass' };
        Object.entries(classes).forEach(([text, kind]) => check(Parser.classify(text).kind === kind, `classify("${text}") should be ${kind}, got ${Parser.classify(text).kind}`));
        check(Parser.classify(55.5).kind === 'num' && Parser.classify(55.5).num === 55.5, 'A fractional grade must stay numeric');
        check(Parser.classify(101).kind !== 'num', 'A grade of 101 must not be accepted as a valid numeric grade');
        check(Parser.classify(-5).kind !== 'num', 'A grade of -5 must not be accepted as a valid numeric grade');

        const textual = solo({ '22283': 'לא נבחן', '22261': 'טקסט חופשי', '34221': 'פטור', '34225': 'פטור' });
        const ev = evalFull(textual);
        check(subj(ev, 'history').final === null && subj(ev, 'history').status !== 'fail', 'Unattended/free-text history must stay missing, never a numeric failure');
        check(subj(ev, 'civics').status === 'exempt' && ev.manualReview.required && ev.tier !== 1, 'Exempt text ("פטור") in a core subject must require a coordinator decision, not grant automatic eligibility');
        noNaN(ev, 'ev');
        noNaN([BagrutAdvisor.summarize([ev]), BagrutAdvisor.summarizePace([ev])], 'advisor');

        const fraction = evalFull(solo({ '22283': 55.5, '22261': 55.5 }));
        check(subj(fraction, 'history').comps[0].num === 55.5 && subj(fraction, 'history').status === 'pass', '55.5 must be a valid passing grade');
        noNaN(fraction, 'fraction');

        [101, -5].forEach(bad => {
          const tz = solo({ '22283': bad, '22261': bad });
          const out = evalFull(tz);
          const accepted = out.subjects.flatMap(s => s.comps).filter(c => c.state === 'num' && (c.num > 100 || c.num < 0));
          check(!accepted.length, `Out-of-range bagrut grade ${bad} was accepted as a valid numeric grade (${accepted.length} components)`);
          noNaN(out, 'out-of-range ' + bad);
        });

        const g = 'אנגלית 4 יח"ל יב1 דוד בדיקה [7001]';
        const average = events => { world({ roster: [stu(1, 'יב', 'יב1')], sadin: sadinRows(events.map((sc, i) => ({ tz: T(1), ev: `אירוע${i} (10)`, sc, grp: g, dt: '01/10/2026' }))) }); return Store.currentOf(T(1))[0]; };
        const mixed = average(['לא נבחן', 80]);
        check(mixed.avg === 80 && mixed.n === 1, `A non-attended sadin event must not count as zero (avg ${mixed.avg}, n ${mixed.n})`);
        const ranged = average([80, 105, -3]);
        check(ranged.avg === 80 && ranged.n === 1, `Out-of-range sadin scores 105 / -3 must be ignored (avg ${ranged.avg}, n ${ranged.n})`);
      });
    });

    /* ====================================================================
       קבוצה B — מנוע זכאות לבגרות
       QA-2.1..QA-2.7, QA-2.9..QA-2.14, INV-7 + רגרסיית מעורבות חברתית
       ==================================================================== */
    await group('Group B — eligibility engine: QA-2.1..2.7, QA-2.9..2.14, INV-7, social-involvement regression', async () => {
      resetConfig();
      await part('QA-2.1 fully eligible 12th grader', async () => {
        const ev = evalFull(solo());
        same([ev.tier, ev.manual, kinds(ev)], [1, false, []], 'Eligible student must be tier 1 without blockers');
        same(ev.gates, { 1: 'pass', 2: 'pass', 3: 'pass' }, 'All gates must pass');
        check(ev.subjects.length === 7 && ev.subjects.every(s => s.status === 'pass'), 'All seven core subjects must pass');
        check(ev.major.chosen && ev.major.chosen.id === 'physics', 'The 5-unit major must be chosen');
        check(ev.internals.length === 4 && ev.internals.every(i => i.done), 'All internal units must be done');
      });

      await part('QA-2.2 pass threshold: 55 passes, 54 fails without compensation', async () => {
        const history = grade => subj(evalFull(solo({ '22283': grade, '22261': grade })), 'history');
        check(history(55).status === 'pass', '55 must pass');
        check(history(54).status !== 'pass', '54 must not pass');
        Config.setCompensation({ enabled: false });
        const ev54 = evalFull(solo({ '22283': 54, '22261': 54 })), ev55 = evalFull(solo({ '22283': 55, '22261': 55 }));
        check(ev54.tier >= 3 && kinds(ev54).includes('fail'), '54 must block eligibility when compensation is disabled');
        check(ev55.tier === 1, '55 must stay eligible when compensation is disabled');
        resetConfig();
      });

      await part('QA-2.3 rounding at the threshold', async () => {
        const history = (a, b) => subj(evalFull(solo({ '22283': a, '22261': b })), 'history');
        const low = history(53, 55), edge = history(53.3, 55), high = history(51, 56);
        near(low.final, 54.4, 'Weighted 54.4'); near(edge.final, 54.49, 'Weighted 54.49'); near(high.final, 54.5, 'Weighted 54.5');
        check(low.status !== 'pass' && edge.status !== 'pass', '54.4 and 54.49 must not pass');
        check(high.status === 'pass', '54.5 must pass');
      });

      await part('QA-2.4 a missing grade is not a zero', async () => {
        const missing = subj(evalFull(solo({ '22283': null })), 'history');
        check(missing.final === null && missing.status === 'missing' && missing.comps[0].state === 'missing', 'No grade must stay missing and out of the average');
        const zero = subj(evalFull(solo({ '22283': 0 })), 'history');
        check(zero.comps[0].state === 'num' && zero.comps[0].num === 0 && zero.final === 49 && zero.status === 'comp', 'An entered zero must count in the average (49)');
        const absent = evalFull(solo({ '22283': 'לא ניגש' }));
        check(subj(absent, 'history').comps[0].failed && subj(absent, 'history').final === null && !kinds(absent).includes('bagrut-block'), '"לא ניגש" must be a reported failure without an invented average');
        const blocked = evalFull(solo({ '22283': 'חסם' }));
        check(subj(blocked, 'history').comps[0].blocked && kinds(blocked).includes('bagrut-block'), '"חסם" must raise a bagrut-block blocker');
        check(Store.weightedAverage([{ score: null, weight: 1 }, { score: 80, weight: 1 }]).avg === 80, 'Sadin: missing event is not a zero');
        check(Store.weightedAverage([{ score: 0, weight: 1 }, { score: 80, weight: 1 }]).avg === 40, 'Sadin: an entered zero counts');
      });

      const ENG = { 3: ['16381', '16382', '16383', '16387'], 4: ['16382', '16471', '16483', '16486'], 5: ['16471', '16582', '16583', '16586'] };
      const MATH = { 3: ['35173', '35371', '35372'], 4: ['35471', '35472'], 5: ['35571', '35572'] };
      const levelChanges = (e, m, ge, gm) => {

        check(Config.upsertComponent('core', 'math', '4', 0, { ...math4()[0], magenWeight: 40 }).ok, 'A valid component magen override must be accepted');
        r12 = Config.rulesForGrade('יב'); r11 = Config.rulesForGrade('יא');
        same([Config.magenWeight('35481', r12), r12.questionnaires['35471'].magenWeight, Config.magenWeight('35471', r11), r11.questionnaires['35471'].magenWeight], [40, 40, 50, 50],
          'A component override syncs to its catalog codes in the edited cohort only');
        check(Config.upsertComponent('core', 'math', '4', 0, { ...math4()[0], magenWeight: 120 }).ok === false &&
          Config.setQuestionnaire('35471', { magenWeight: -1 }).ok === false, 'Out-of-range magen weights must be rejected');
        check(Config.upsertComponent('core', 'math', '4', 0, { ...math4()[0], magenWeight: null }).ok, 'Clearing a component override must be accepted');
        r12 = Config.rulesForGrade('יב');
        same([Config.magenWeight('35471', r12), 'magenWeight' in math4()[0], 'magenWeight' in r12.questionnaires['35481']], [30, false, false],
          'A cleared component override inherits the cohort default');
        resetConfig();
      });
    });
    await group('Group G — Golden students (22 profiles) in Grade 12 final-certificate mode (fullMode: true)', async () => {
      const ENG = { 3: ['16381', '16382', '16383', '16387'], 4: ['16382', '16471', '16483', '16486'], 5: ['16471', '16582', '16583', '16586'] };
      const MATH = { 3: ['35173', '35371', '35372'], 4: ['35471', '35472'], 5: ['35571', '35572'] };
      const id = n => T(700 + n);
      const student = (n, extra = {}) => stu(700 + n, 'יב', 'יב1', extra);
      const levels = (e, m, score = 80) => ({
        ...Object.fromEntries([...new Set([...Object.values(ENG).flat(), ...Object.values(MATH).flat()])].map(code => [code, null])),
        ...Object.fromEntries([...ENG[e], ...MATH[m]].map(code => [code, score]))
      });
      const golden = (n, changes = {}, extra = {}) => {
        world({ roster: [student(n)], bagrut: bagrutRows(profile(id(n), changes)), ...extra });
        return id(n);
      };
      const evaluated = new Set();
      const final = (n, opts = {}) => {
        const ev = evalFull(id(n), opts);
        evaluated.add(n);
        check(ev && ev.mode === 'full' && ev.adaptive === false && ev.rank === 12,
          `G-${String(n).padStart(2, '0')}: must use grade 12 final-certificate policy`);
        return ev;
      };
      const run = (n, title, fn) => part(`G-${String(n).padStart(2, '0')} ${title}`, async () => {
        resetConfig();
        await fn();
      });
      // Unlike noNaN, this also rejects actual undefined values before JSON serialization can hide them.
      const defined = (value, path = 'evaluation') => {
        check(value !== undefined, `${path} must not be undefined`);
        if (value && typeof value === 'object') Object.entries(value).forEach(([key, child]) => defined(child, `${path}.${key}`));
      };

      await run(1, 'fully eligible; new cohort weights apply to real evaluations', async () => {
        golden(1);
        const ev = final(1);
        same([ev.tier, ev.tierText, ev.blockers.length], [1, 'זכאי מלא', 0], 'Full eligibility without blockers');
        check(ev.subjects.every(s => s.status === 'pass') && ev.internals.every(i => i.done), 'Every core and internal subject passes');
        same([ev.totalUnits, ev.major.chosen.id, ev.major.chosen.units], [23, 'physics', 5], '23 units and a five-unit major');
        for (const level of [3, 4, 5]) {
          golden(1, {
            ...levels(4, level),
            ...Object.fromEntries(MATH[level].map((code, i) => [code, [60, 80, 90][i]])),
            ...Object.fromEntries(ENG[4].map((code, i) => [code, [60, 70, 80, 90][i]])),
            '34221': 60, '34225': 80
          });
          const out = final(1), math = subj(out, 'math'), english = subj(out, 'english');
          same(math.comps.map(c => c.weight), { 3: [25, 35, 40], 4: [65, 35], 5: [60, 40] }[level], `Math ${level} new curriculum`);
          check(MATH[level].slice(level === 3 ? 1 : 0).every(code => Config.magenWeight(code) === 50), `Math ${level}: external components use 50% magen`);
          near(math.final, { 3: 79, 4: 67, 5: 68 }[level], `Math ${level} weighted score`);
          same(english.comps.map(c => c.weight), [27, 27, 26, 20], 'All four English components');
          check(ENG[4].every(code => Config.magenWeight(code) === 30), 'English uses the cohort default of 30% magen');
          near(english.final, 73.9, 'English four-component weighted score');
          near(subj(out, 'civics').final, 74, 'Civics uses 30/70');
          check(out.tier === 1 && out.blockers.length === 0, `Complete math level ${level} stays eligible`);
        }
      });

      await run(2, 'one allowed range compensation or points compensation', async () => {
        for (const [score, type, note] of [[50, 'range', 'קיזוז'], [40, 'points', 'פיצוי נקודות']]) {
          golden(2, { '22283': score, '22261': score });
          const ev = final(2), history = subj(ev, 'history');
          check(ev.tier <= 2 && ev.compensation && ev.compensation.type === type, `${score}: eligibility via ${type}`);
          check(history.final === score && history.compApplied === type && ev.notes.some(n => n.includes(note)), `${score}: explicit compensation and explanatory note`);
          same(ev.blockers, [], `${score}: no remaining blockers`);
        }
      });

      await run(3, 'all core subjects pass but only 19 units', async () => {
        golden(3, { ...levels(5, 4), '36361': null });
        const ev = final(3);
        check(ev.subjects.every(s => s.status === 'pass'), 'Every mandatory subject must pass');
        same(ev.totalUnits, 19, 'Five-unit English plus four-unit math and the other cores total 19');
        check(ev.tier === 4 && ev.blockers.some(b => b.k === 'units' && b.hard), `Under 21 units must block (tier ${ev.tier})`);
      });

      await run(4, 'single 40 without enough compensation points', async () => {
        golden(4, { ...levels(4, 4, 55), '36361': 55, '22283': 40, '22261': 40 });
        const ev = final(4), history = subj(ev, 'history');
        check(history.status === 'severe' && !history.compApplied && ev.compensation === null, 'A 40 without sufficient points is not compensated');
        // Engine contract (classify, unchanged since the pre-split engine; see QA-3.3): one hard blocker = tier 3, compounding hard blockers = tier 4.
        check(ev.tier === 3 && ev.autoTier === 3 && ev.blockers.some(b => b.k === 'severe' && b.hard), `Uncompensated single 40 is a hard blocker, not eligible (got tier ${ev.tier})`);
        golden(4, { ...levels(4, 4, 55), '36361': 55, '22283': 40, '22261': 40, '34221': 40, '34225': 40 });
        const two = final(4);
        check(two.tier === 4 && two.compensation === null && two.blockers.filter(b => b.hard).length >= 2, `Two uncompensated 40s must be tier 4 (got ${two.tier})`);
      });

      await run(5, 'double range failure and uncompensable Hebrew', async () => {
        golden(5, { '22283': 48, '22261': 48, '34221': 50, '34225': 50 });
        const double = final(5);
        check(double.tier >= 3 && double.compensation === null && double.blockers.some(b => b.k === 'comp-over' && b.hard),
          `48 and 50 exceed the quota: hard comp-over blocker, not eligible (got tier ${double.tier})`);
        for (const score of [50, 40]) {
          golden(5, { '11283': score, '11281': score });
          const ev = final(5);
          check(ev.tier === 3 && ev.blockers.some(b => b.k === 'critical' && b.hard), `Hebrew ${score} is a hard critical blocker, not eligible (got tier ${ev.tier})`);
          check(!subj(ev, 'hebrew').compApplied && ev.compensation === null, `Hebrew ${score} permits neither form of compensation`);
        }
        golden(5, { '11283': 40, '11281': 40, '22283': 40, '22261': 40 });
        const compound = final(5);
        check(compound.tier === 4 && compound.atRisk === true && kinds(compound).includes('critical'), `Hebrew 40 plus another failure must be tier 4 (got ${compound.tier})`);
      });

      await run(6, 'special education is evaluated individually but excluded from advisor denominator', async () => {
        world({
          roster: [student(1), student(6, { track: Config.SPECIAL_ED })],
          bagrut: bagrutRows([...profile(id(1)), ...profile(id(6), { '36361': 40 })])
        });
        const regular = final(1), special = final(6), summary = BagrutAdvisor.summarize([regular, special]);
        same([regular.tier, special.tier], [1, 3], 'Both tracks are evaluated by the engine');
        same([summary.counted, summary.specialEd, summary.eligibilityInclSpecialEd, summary.eligibilityExSpecialEd],
          [1, 1, 100, 100], 'Special-ed student is excluded from the eligibility denominator');
      });

      await run(7, 'unmapped questionnaire holds automatic eligibility until a decision', async () => {
        golden(7, { '999001': { final: 80, subject: 'מקצוע סינתטי לא ממופה' } });
        const ev = final(7);
        check(ev.manualReview.required === true && ev.tier >= 3, 'Unknown code must prevent automatic eligibility');
        check(ev.manualReview.foreignCodes.some(c => c.code === '999001' && c.reason === 'unlisted-code'), 'Unknown code is explicitly reported');
        check(Config.setException(id(7), { isException: true, overrideStatus: 'eligible', reason: 'synthetic review' }).ok, 'Coordinator decision is saved');
        const decided = final(7);
        check(decided.manual && decided.tier === 1 && !decided.manualReview.required, 'Coordinator decision resolves the hold');
      });

      await run(8, 'rosterOverride persists class and track in eligibility inputs', async () => {
        golden(8);
        const before = final(8);
        check(Config.setRosterOverride(id(8), { grade: 'יב', homeroom: 'יב2', track: Config.SPECIAL_ED }).ok, 'Save class/track override');
        Store.refresh();
        const override = Config.getRosterOverrides()[id(8)], trainee = Store.trainees.get(id(8)), ev = final(8);
        same([override.grade, override.homeroom, override.track], ['יב', 'יב2', Config.SPECIAL_ED], 'Override is stored');
        same([trainee.gradeKey, trainee.classKey, Config.trackFor(id(8), trainee.track, trainee.classKey)],
          ['יב', 'יב2', Config.SPECIAL_ED], 'Effective engine inputs use the override');
        same([ev.tier, ev.totalUnits, ev.cohortId], [before.tier, before.totalUnits, before.cohortId], 'Same-grade reassignment preserves eligibility and cohort');
        same(BagrutAdvisor.summarize([ev]).specialEd, 1, 'Advisor uses the overridden track');
      });

      await run(9, 'reinforcement neither duplicates units nor changes the selected level', async () => {
        golden(9);
        const before = final(9);
        golden(9, {}, { groups: groupRows([
          { tz: id(9), grade: 'יב', cls: 'יב1', gid: 'מתמטיקה 4 יח"ל יב1 מורה בדיקה [7901]' },
          { tz: id(9), grade: 'יב', cls: 'יב1', gid: 'תגבור מתמטיקה 5 יח"ל יב1 מורה בדיקה [7902]' }
        ]) });
        const ev = final(9);
        check(Store.groupsOf(id(9)).length === 2 && Store.groupsOf(id(9)).some(g => g.reinforcement), 'Both real and reinforcement groups were imported');
        same([ev.tier, ev.totalUnits, subj(ev, 'math').units, ev.blockers],
          [before.tier, before.totalUnits, '4', before.blockers], 'Reinforcement cannot harm eligibility or double count units');
      });

      await run(10, 'new student with zero personal bagrut rows', async () => {
        // A classmate makes the dataset loaded; this is not the neutral "no file uploaded" state.
        world({ roster: [student(1), student(10)], bagrut: bagrutRows(profile(id(1))) });
        same(Store.attemptsOf(id(10)).length, 0, 'New student has no bagrut records');
        const ev = final(10), summary = BagrutAdvisor.summarize([ev]);
        check(ev.tier === 4 && kinds(ev).includes('questionnaire') && ev.totalUnits === 0, 'Final mode identifies missing requirements');
        noNaN([ev, summary], 'new-student');
        defined([ev, summary]);
      });

      await run(11, '55 passes but 54 is compensation, never pass', async () => {
        for (const [score, status, tier] of [[55, 'pass', 1], [54, 'comp', 2]]) {
          golden(11, { '22283': score, '22261': score });
          const ev = final(11);
          same([subj(ev, 'history').final, subj(ev, 'history').status, ev.tier], [score, status, tier], `Threshold ${score}`);
        }
      });

      await run(12, '54.4/54.5 rounding and derived 30%/50% magen', async () => {
        for (const [internal, raw, rounded, status, tier] of [[53, 54.4, 54, 'comp', 2], [51, 54.5, 55, 'pass', 1]]) {
          golden(12, { '22283': internal, '22261': raw === 54.4 ? 55 : 56 });
          const ev = final(12), history = subj(ev, 'history');
          near(history.final, raw, 'Unrounded weighted history score');
          same([Math.round(history.final), history.status, ev.tier], [rounded, status, tier], 'Round once at the subject threshold');
        }
        for (const [subject, codes, weight, submission] of [
          ['english', ENG[4], 30, 65], ['math', MATH[4], 50, 59]
        ]) {
          for (const [raw, exam, rounded, status, tier] of [
            [54.4, weight === 30 ? 349 / 7 : 49.8, 54, 'comp', 2],
            [54.5, 50, 55, 'pass', 1]
          ]) {
            near(submission * weight / 100 + exam * (100 - weight) / 100, raw, `${subject}: raw submission/exam boundary`);
            golden(12, Object.fromEntries(codes.map(code => [code, { sub: submission, exam }])));
            const ev = final(12), s = subj(ev, subject), attempts = Store.attemptsOf(id(12)).filter(a => codes.includes(a.code));
            check(attempts.length === codes.length && attempts.every(a => a.derived && a.final === '' && a.cls.num === rounded),
              `${subject}: every component is derived from submission/exam, rounded to ${rounded}`);
            check(codes.every(code => Config.magenWeight(code, Config.rulesForGrade('יב')) === weight), `${subject}: actual magen weight is ${weight}%`);
            same([s.final, s.status, ev.tier], [rounded, status, tier], `${subject}: derived ${raw} gives ${status}`);
          }
        }
      });

      await run(13, 'English level change 5 to 4 is informational only', async () => {
        golden(13, { '16582': 40 });
        const ev = final(13), english = subj(ev, 'english');
        same([english.units, english.comps.length, english.final, ev.totalUnits, ev.tier], ['4', 4, 80, 23, 1], 'Only complete four-unit English is counted');
        const old = ev.manualReview.foreignCodes.find(c => c.code === '16582');
        check(old && old.reason === 'other-level' && old.informational === true, 'Old five-unit questionnaire remains informational');
        check(!ev.manualReview.required && ev.blockers.length === 0 && !ev.manual, 'Clean level change needs no blocking coordinator decision');
      });

      await run(14, 'best repeated sitting is selected once regardless of row order', async () => {
        const rows = [...profile(id(14), { '22283': null }),
          { tz: id(14), code: '22283', final: 40, moed: 'חורף' },
          { tz: id(14), code: '22283', final: 80, moed: 'קיץ' }];
        for (const bagrut of [rows, [...rows].reverse()]) {
          world({ roster: [student(14)], bagrut: bagrutRows(bagrut) });
          const ev = final(14), history = subj(ev, 'history');
          same(Store.attemptsOf(id(14)).filter(a => a.code === '22283').length, 2, 'Keep both sittings for audit');
          same([history.comps.length, history.comps[0].num, history.final, ev.totalUnits, ev.tier],
            [2, 80, 73, 23, 1], 'Best grade counted once');
        }
      });

      await run(15, 'mandatory-subject exemption needs coordinator review', async () => {
        golden(15, { '22283': 'פטור', '22261': 'פטור' });
        const ev = final(15);
        check(subj(ev, 'history').status === 'exempt' && ev.manualReview.required === true, 'Exemption cannot silently grant eligibility');
        check(ev.tier >= 3 && ev.blockers.some(b => b.k === 'exempt-review' && b.hard), 'Exemption raises an explicit review blocker');
        check(Config.setException(id(15), { isException: true, overrideStatus: 'eligible', reason: 'synthetic exemption approval' }).ok, 'Save exemption decision');
        check(final(15).tier === 1 && final(15).manual, 'Only the coordinator decision permits eligibility');
      });

      await run(16, 'missing grade-12 internal 30% blocks final certification', async () => {
        golden(16, { '22283': null, '22261': 80 });
        const ev = final(16), history = subj(ev, 'history'), missing = history.comps.find(c => c.codes.includes('22283'));
        same(Config.rulesForGrade('יב').coreSubjects.find(s => s.id === 'history').components[0].expectedGrade, 'יב', 'Use the new grade-12 internal default');
        check(missing.internal && missing.due && history.incomplete === true && history.final === null && history.missingPct === 30,
          'An external grade alone cannot replace the required 30% in final mode');
        // Same contract as QA-3.3: a single missing 30% is a hard blocker (tier 3, savable), never eligible.
        check(ev.tier === 3 && ev.savable === true && ev.blockers.some(b => b.k === 'questionnaire' && b.hard && b.text.includes('22283')),
          `Missing 30% must block final certification (got tier ${ev.tier})`);
        golden(16, { '22283': null, '22261': 80, '34221': null, '34225': 80 });
        const two = final(16);
        check(two.tier === 4 && ['history', 'civics'].every(s => subj(two, s).incomplete === true), `Two missing 30% components must be tier 4 (got ${two.tier})`);
      });

      await run(17, 'twelve-year override leaves eligibility denominator and is not at risk', async () => {
        golden(17, { '36361': 40 });
        check(Config.setException(id(17), { isException: true, overrideStatus: 'twelve', reason: 'synthetic twelve-year track' }).ok, 'Save twelve-year status');
        const ev = final(17), summary = BagrutAdvisor.summarize([ev]);
        same([ev.tier, ev.overrideStatus, ev.atRisk, summary.total, summary.counted], [5, 'twelve', false, 1, 0], 'Twelve-year student is not a failed eligibility candidate');
      });

      await run(18, 'plus5 simulation respects both borderline boundaries', async () => {
        const rules = Config.rulesForGrade('יב');
        for (const score of [rules.borderlineMin - 0.6, rules.borderlineMin - 0.5, rules.borderlineMin, rules.passGrade - 1, rules.passGrade - 0.5, rules.passGrade]) {
          golden(18, { '22283': score, '22261': score });
          const ordinary = final(18, { plus5: false }), boosted = final(18, { plus5: true });
          const eligibleForBonus = Math.round(score) >= rules.borderlineMin && Math.round(score) < rules.passGrade;
          const history = subj(boosted, 'history');
          near(history.adj, score + (eligibleForBonus ? rules.borderlineBonus : 0), `${score}: configured bonus only inside the interval`);
          same(history.boosted, eligibleForBonus, `${score}: boost marker`);
          same(subj(ordinary, 'history').boosted, false, 'Ordinary evaluation never applies the bonus');
          if (eligibleForBonus) same([subj(ordinary, 'history').status, ordinary.tier, history.status, boosted.tier], ['comp', 2, 'pass', 1], 'Bonus changes borderline compensation into a full pass');
          else same([history.status, boosted.tier], [subj(ordinary, 'history').status, ordinary.tier], 'Outside the interval, classification is unchanged');
        }
      });

      await run(19, 'failed five-unit primary major blocks gate 2', async () => {
        golden(19, { '36361': 40 });
        const ev = final(19), physics = ev.major.cands.find(c => c.id === 'physics');
        check(physics.units === 5 && physics.status === 'fail', 'Primary five-unit major failed');
        check(ev.tier === 3 && ev.gates[2] === 'fail' && ev.blockers.some(b => b.k === 'major-fail' && b.gate === 2 && b.hard), 'Major gate blocks eligibility without double-counting the derived unit deficit');
      });

      await run(20, 'traffic education 700181 is not a foreign questionnaire hold', async () => {
        golden(20);
        const before = final(20);
        golden(20, { '700181': { final: 40, subject: 'חינוך תעבורתי' } });
        const ev = final(20);
        check(Store.attemptsOf(id(20)).some(a => a.code === '700181'), 'Traffic questionnaire was actually imported');
        check(!ev.manualReview.required && !ev.manualReview.foreignCodes.some(c => c.code === '700181'), 'Traffic education does not require coordinator review');
        same([ev.tier, ev.totalUnits, ev.blockers, ev.tierText], [before.tier, before.totalUnits, before.blockers, before.tierText], 'Traffic education neither blocks nor earns bagrut units');
      });

      await run(21, 'explicit useCurrent false/true comparison in fullMode', async () => {
        golden(21, { '22283': null }, { sadin: sadinRows([
          { tz: id(21), ev: 'מבחן (100)', sc: 80, grp: 'היסטוריה יב1 מורה בדיקה [7921]', dt: '01/11/2026' }
        ]) });
        const off = final(21, { useCurrent: false }), on = final(21, { useCurrent: true });
        const a = subj(off, 'history'), b = subj(on, 'history');
        same([a.final, a.status, a.incomplete, a.forecast], [null, 'missing', true, false], 'Without current grades, missing 30% stays unresolved');
        same([b.final, b.status, b.incomplete, b.source, b.forecast, b.filled.length], [73, 'pass', false, 'current', true, 1], 'With current grades, 80 fills only the missing 30%');
        check(off.tier >= 3, 'Without current grades the student cannot be automatically eligible');
        same([on.tier, off.totalUnits, on.totalUnits, on.usedForecast], [1, 21, 21, true], 'Forecast can change tier but must not award earned units');
        check(kinds(off).includes('questionnaire') && !kinds(on).includes('questionnaire'), 'The missing-component blocker is removed only in the forecast');
        same(final(21, { useCurrent: false }), off, 'Turning forecast off immediately restores the actual certificate result');
      });

      await run(22, 'INV-7 removing manual decision and roster override restores automatic state', async () => {
        golden(22, { '22283': 40, '22261': 40, '34221': 40, '34225': 40 });
        const before = final(22), traineeBefore = Util.clone(Store.trainees.get(id(22)));
        const exceptionsBefore = Util.clone(Config.data.traineeExceptions), overridesBefore = Util.clone(Config.getRosterOverrides());
        check(before.tier === 4 && !before.manual, 'Automatic baseline is blocked');
        check(Config.setException(id(22), { isException: true, overrideStatus: 'eligible', reason: 'synthetic INV-7 decision' }).ok, 'Set manual decision');
        check(Config.setRosterOverride(id(22), { grade: 'יב', homeroom: 'יב2', track: Config.SPECIAL_ED }).ok, 'Set roster override');
        Store.refresh();
        const manual = final(22);
        check(manual.manual && manual.tier === 1 && Store.trainees.get(id(22)).classKey === 'יב2', 'Both overrides actually take effect');
        check(Config.setException(id(22), { isException: false, overrideStatus: '', reason: '' }).ok, 'Clear manual decision');
        same(final(22), before, 'Clearing the decision immediately restores automatic evaluation');
        check(Config.removeRosterOverride(id(22)).ok, 'Remove roster override');
        Store.refresh();
        same(final(22), before, 'Full evaluation is restored with no residual override state');
        same(Store.trainees.get(id(22)), traineeBefore, 'Original roster identity is restored');
        same(Config.data.traineeExceptions, exceptionsBefore, 'No residual manual decision');
        same(Config.getRosterOverrides(), overridesBefore, 'No residual roster override');
      });
      same([...evaluated].sort((a, b) => a - b), Array.from({ length: 22 }, (_, i) => i + 1), 'All 22 distinct golden profiles were evaluated in fullMode');
      resetConfig();
    });
  } catch (e) {
    outcome.push({ title: 'Test harness', failures: [`EXCEPTION ${e && e.stack ? e.stack : e}`] });
  } finally {
    if (saved) {
      Config.data = saved.data; Config._cache = saved.cache; Config._ignoredCache = saved.ignored; Config._activeCohort = saved.active;
      Config._rulesOverride = saved.override; Config._write = saved.write; Config._storePut = saved.put;
      Store.raw = saved.raw; Store.loaded = saved.loaded; Config._invalidateRoster();
    }
  }

  const failed = outcome.filter(g => g.failures.length);
  results.textContent = outcome.map(g => (g.failures.length ? `FAIL ${g.title}\n${g.failures.map(f => '  - ' + f).join('\n')}` : `PASS ${g.title}`)).join('\n') +
    (failed.length ? `\n${failed.length} of ${outcome.length} groups failed.` : '\nAll tests passed.');
  document.title = failed.length ? 'FAIL - Engine invariants tests' : 'PASS - Engine invariants tests';
})();
</script>
