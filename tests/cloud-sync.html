<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cloud sync regression tests</title>
<pre id="results">Running...</pre>
<script>
// Never send cloud traffic from this test page, even if saved settings exist.
const localFetch = window.fetch.bind(window);
window.fetch = (url, options) => {
  const target = new URL(url, location.href);
  if (target.origin !== location.origin) throw new Error('Outbound network blocked by tests');
  return localFetch(target, options);
};
</script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script>
(async () => {
  const results = document.getElementById('results'), passed = [];
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const rejects = async (fn, text) => {
    let error;
    try { await fn(); } catch (e) { error = e; }
    assert(error && (!text || error.message.includes(text)), 'Expected rejection: ' + text);
  };
  const originalPut = Config._storePut, originalWrite = Config._write;
  const tz = '000000123';
  let posts = [], remote = { ok: true, rev: 0, updatedAt: 0, payload: null }, failPull = false, failPush = false, holdPull = null, holdPost = null;
  const stopTimer = () => clearTimeout(CloudSync._timer);
  try {
    await Config.ready;
    CloudSync.saveSettings({ url: 'https://cloud-sync.test/exec', apiToken: 'test-token', passcode: 'test-school-pass' });
    window.fetch = async (url, options = {}) => {
      assert(url === 'https://cloud-sync.test/exec', 'Unexpected outbound request blocked');
      assert(options.method === 'POST' && !url.includes('token='), 'Only POST allowed');
      const body = JSON.parse(options.body);
      assert(body.token === 'test-token', 'Missing token');
      posts.push(body);
      if (body.action === 'meta') return { ok: true, json: async () => ({ ...remote, payload: undefined }) };
      if (body.action === 'pull') {
        if (failPull) throw new Error('Test offline');
        const snapshot = structuredClone(remote);
        if (holdPull) await holdPull;
        return { ok: true, json: async () => snapshot };
      }
      if (holdPost) await holdPost;
      if (failPush) return { ok: true, json: async () => ({ ok: false, error: 'Test write failure' }) };
      if (body.baseRev !== remote.rev && !body.force) return { ok: true, json: async () => ({ ok: false, conflict: true, rev: remote.rev, updatedAt: remote.updatedAt }) };
      remote = { ok: true, rev: remote.rev + 1, updatedAt: Date.now(), payload: body.payload };
      return { ok: true, json: async () => ({ ok: true, rev: remote.rev, updatedAt: remote.updatedAt }) };
    };
    CloudSync._setMeta({ dirty: false, rev: 0, syncedAt: 0 });
    await CloudSync.pullCloudState();
    assert(Config.setRoster([{ tz, firstName: 'Test', lastName: 'Student', grade: 'י', homeroom: 'י1', track: 'רגילה' }], 'roster.csv').ok, 'Roster save');
    for (const key of Config.DATASET_KEYS) {
      assert((await Config.setDataset(key, [{ tz, gradeKey: 'י', score: 80, cls: { kind: 'fail', block: true } }], key + '.csv')).ok, 'Dataset save');
    }
    Config.setException(tz, { note: 'Local note' });
    stopTimer();
    await CloudSync.pushCloudState();
    assert(!CloudSync.hasUnpublished() && CloudSync.meta().rev === 1, 'Revision not persisted');
    assert(remote.payload.enc === 'aes2', 'Push was not aes2');
    assert((await CloudSync.open(remote.payload)).studentMeta[tz].note === 'Local note', 'Encrypted round trip');
    passed.push('Authenticated POST pull/push; aes2 round trip and persisted server revision');

    CloudSync._set('pass', '');
    await rejects(() => CloudSync.seal({}), 'קוד בית-ספר');
    CloudSync._set('pass', 'test-school-pass');
    await rejects(() => CloudSync.open({ enc: 'none', data: '{}' }), 'אינם מוצפנים');
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const legacy = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await CloudSync._key(CloudSync.passcode(), salt, 100000), new TextEncoder().encode('{"legacy":true}'));
    assert((await CloudSync.open({ enc: 'aes1', salt: CloudSync._b64(salt), iv: CloudSync._b64(iv), data: CloudSync._b64(legacy) })).legacy, 'Legacy aes1 failed');
    const independentKey = await CloudSync._key(CloudSync.passcode(), CloudSync._unb64(remote.payload.salt), 600000);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: CloudSync._unb64(remote.payload.iv) }, independentKey, CloudSync._unb64(remote.payload.data));
    passed.push('Mandatory passcode; plaintext rejection; aes1 compatibility; aes2 uses 600,000 iterations');

    const state = await CloudSync.open(remote.payload);
    remote = { ...remote, rev: 2, updatedAt: Date.now() + 1 };
    Config.setException(tz, { note: 'Keep local' }); stopTimer();
    CloudSync._ready = false;
    let before = posts.filter(p => p.action === 'push').length;
    assert(await CloudSync.pushCloudState() === 'kept-local', 'Initial pull did not preserve local');
    assert(posts.filter(p => p.action === 'push').length === before && CloudSync.status.kind === 'conflict', 'Push followed kept-local');
    assert(Config.getException(tz).note === 'Keep local', 'Local note lost');
    passed.push('kept-local stops initial push and exposes conflict without overwriting');

    assert(await CloudSync.pullCloudState({ force: true }) === 'applied', 'Conflict pull failed');
    assert(Config.getException(tz).note === 'Local note' && CloudSync.meta().rev === 2, 'Pull resolution failed');
    Config.setException(tz, { note: 'Conflict again' }); stopTimer();
    remote.rev = 3;
    assert(await CloudSync.pushCloudState() === 'kept-local' && CloudSync.hasUnpublished(), 'Stale baseRev was accepted');
    await CloudSync.pushCloudState({ force: true });
    assert(posts.at(-1).force === true && !CloudSync.hasUnpublished() && CloudSync.meta().rev === 4, 'Force resolution failed');
    passed.push('Server conflict preserves dirty data; explicit pull and force-push resolution');

    const tabPushes = () => posts.filter(p => p.action === 'push');
    assert(CloudSync._tabRev === 4 && CloudSync.meta().rev === 4, 'Tab revision not tracking successful sync');
    // Another tab syncs rev 5 and updates the shared localStorage while this tab's memory is still at rev 4.
    remote = { ...remote, rev: 5, updatedAt: Date.now() + 5 };
    CloudSync._setMeta({ rev: 5, syncedAt: remote.updatedAt });
    assert(await CloudSync.pullCloudState() === 'applied' && CloudSync._tabRev === 5, 'Stale tab treated another tab revision as already synced');
    remote = { ...remote, rev: 6, updatedAt: Date.now() + 6 };
    CloudSync._setMeta({ rev: 6, syncedAt: remote.updatedAt });
    const remoteBeforeStalePush = remote.payload;
    Config.setException(tz, { note: 'Stale tab edit' }); stopTimer();
    const pushesBefore = tabPushes().length;
    assert(await CloudSync.pushCloudState() === 'kept-local', 'Stale tab push was not stopped');
    assert(tabPushes().length === pushesBefore + 1 && tabPushes().at(-1).baseRev === 5 && !tabPushes().at(-1).force, 'Stale tab sent the shared localStorage revision');
    assert(remote.rev === 6 && remote.payload === remoteBeforeStalePush && CloudSync.status.kind === 'conflict' && CloudSync.hasUnpublished() && CloudSync._tabRev === 5, 'Stale tab overwrote or acknowledged the other tab revision');
    await CloudSync.pushCloudState({ force: true });
    assert(CloudSync._tabRev === 7 && remote.rev === 7 && CloudSync.meta().rev === 7 && !CloudSync.hasUnpublished(), 'Force push did not refresh the tab revision');
    passed.push('Two tabs: stale tab sends its own baseRev, stops on conflict, and only advances after its own pull/push');

    let releasePost, enteredPost;
    const enteredUpload = new Promise(resolve => { enteredPost = resolve; });
    const fetchBeforeHold = window.fetch;
    holdPost = new Promise(resolve => { releasePost = resolve; });
    window.fetch = async (url, options) => {
      if (JSON.parse(options.body).action === 'push') enteredPost();
      return fetchBeforeHold(url, options);
    };
    Config.setException(tz, { note: 'First upload' }); stopTimer();
    const uploading = CloudSync.pushCloudState();
    await enteredUpload;
    Config.setException(tz, { note: 'Edited during upload' }); stopTimer();
    releasePost();
    await uploading;
    holdPost = null;
    assert(CloudSync.hasUnpublished(), 'Earlier upload cleared newer local edits');
    const deadline = Date.now() + 10000;
    while (CloudSync.hasUnpublished()) {
      assert(Date.now() < deadline, 'Follow-up autosync timed out');
      await new Promise(resolve => setTimeout(resolve, 20));
    }
    assert((await CloudSync.open(remote.payload)).studentMeta[tz].note === 'Edited during upload', 'Follow-up autosync lost note');
    window.fetch = fetchBeforeHold;
    passed.push('Concurrent upload edits remain dirty and debounce into a follow-up encrypted upload');

    const localRev = CloudSync.meta().rev;
    remote.rev++;
    const visibilityDescriptor = Object.getOwnPropertyDescriptor(document, 'visibilityState');
    Object.defineProperty(document, 'visibilityState', { configurable: true, value: 'visible' });
    try {
      document.dispatchEvent(new Event('visibilitychange'));
      await CloudSync._queue;
    } finally {
      if (visibilityDescriptor) Object.defineProperty(document, 'visibilityState', visibilityDescriptor);
      else delete document.visibilityState;
    }
    assert(CloudSync.status.kind === 'conflict' && CloudSync.meta().rev === localRev, 'Visibility meta warning incorrectly acknowledged server data');
    let unload = new Event('beforeunload', { cancelable: true });
    CloudSync._setMeta({ dirty: true });
    window.dispatchEvent(unload);
    assert(unload.defaultPrevented, 'Missing unload warning');
    passed.push('New server revision warns without advancing local revision; dirty unload is prevented');

    failPush = true;
    await rejects(() => CloudSync.pushCloudState({ force: true }), 'Test write failure');
    assert(CloudSync.hasUnpublished() && CloudSync.status.kind === 'error', 'Write error lost dirty data');
    failPush = false;
    CloudSync._ready = false; failPull = true;
    before = posts.filter(p => p.action === 'push').length;
    await rejects(() => CloudSync.pushCloudState(), 'Test offline');
    assert(posts.filter(p => p.action === 'push').length === before, 'Push followed read failure');
    failPull = false;
    passed.push('Failed read blocks writes; failed write exposes errors and preserves pending data');

    let releasePull;
    holdPull = new Promise(resolve => { releasePull = resolve; });
    const pulling = CloudSync.pullCloudState({ force: true });
    await new Promise(resolve => setTimeout(resolve, 20));
    Config.setException(tz, { note: 'Edited while downloading' }); stopTimer();
    releasePull();
    assert(await pulling === 'kept-local', 'Concurrent download edit overwritten');
    holdPull = null;
    assert(Config.getException(tz).note === 'Edited while downloading', 'Concurrent note lost');
    passed.push('Forced pull preserves edits made during download');

    const bad = structuredClone(state);
    bad.rosterData.data[0].tz = '123';
    bad.groupsData.data.push(null, [], 'invalid', { tz: { unexpected: true } });
    bad.studentMeta = { '123': { note: 'Normalized', isException: 'false', reason: {} }, bad: null };
    bad.rosterOverrides = { '123': { tz: '<script>', note: {}, hidden: 'false', homeroom: [] } };
    const clean = sanitizeState(bad);
    assert(clean.rosterData.data[0].tz === tz && clean.groupsData.data.length === 1, 'Rows not sanitized');
    assert(clean.studentMeta[tz].note === 'Normalized' && !clean.studentMeta[tz].isException && clean.studentMeta[tz].reason === '', 'Metadata types invalid');
    assert(clean.rosterOverrides[tz].tz === tz && !clean.rosterOverrides[tz].hidden && clean.rosterOverrides[tz].note === '', 'Override types invalid');
    assert(clean.bagrutData.data[0].cls.kind === 'fail' && clean.bagrutData.data[0].cls.block, 'Blocking grade changed');
    await rejects(() => CloudSync.applyState({ ...state, groupsData: 17 }), 'groupsData');
    passed.push('Untrusted rows, IDs, metadata and override types sanitized; grade semantics preserved');

    const previousData = JSON.stringify(Config.data), previousRoster = JSON.stringify(Config.getRosterEntry());
    let previousDataset = structuredClone(Config.getDataset('groupsData'));
    let failOnce = true;
    Config._storePut = async function(key, entry) {
      if (key === 'sadinData' && failOnce) { failOnce = false; return { ok: false, error: 'Test quota' }; }
      return originalPut.call(this, key, entry);
    };
    const incoming = { ...state, classNicknames: { new: 'Cloud name' }, groupsData: { data: [], uploadedAt: 1, fileName: 'cloud' } };
    await rejects(() => CloudSync.applyState(incoming), 'Test quota');
    assert(JSON.stringify(Config.data) === previousData && JSON.stringify(Config.getRosterEntry()) === previousRoster, 'Quota failure partially committed settings/roster');
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Partial IndexedDB write not rolled back');
    Config._storePut = originalPut;
    passed.push('IndexedDB quota failure leaves settings/roster unchanged and restores prior datasets');

    let releasePut, enteredPut;
    const entered = new Promise(resolve => { enteredPut = resolve; });
    const hold = new Promise(resolve => { releasePut = resolve; });
    let holdOnce = true;
    Config._storePut = async function(key, entry) {
      const r = await originalPut.call(this, key, entry);
      if (holdOnce) { holdOnce = false; enteredPut(); await hold; }
      return r;
    };
    const applying = CloudSync.applyState(incoming);
    await entered;
    Config.setException(tz, { note: 'Edited during IndexedDB' }); stopTimer();
    assert((await Config.setDataset('groupsData', [{ tz, groupId: 'new-local-group' }], 'new-local.csv')).ok, 'Concurrent dataset save failed');
    previousDataset = structuredClone(Config.getDataset('groupsData'));
    stopTimer();
    releasePut();
    assert(await applying === 'kept-local', 'Concurrent IndexedDB edit not detected');
    assert(Config.getException(tz).note === 'Edited during IndexedDB' && CloudSync.hasUnpublished(), 'Concurrent IndexedDB edit dropped');
    Config._storePut = originalPut;
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Concurrent apply did not roll back');
    passed.push('Edits during applyState awaits stay dirty and prevent the cloud commit');

    let failConfigOnce = true;
    Config._write = function(key, value) {
      if (key === this.KEYS.config && failConfigOnce) { failConfigOnce = false; return { ok: false, error: 'Test local quota' }; }
      return originalWrite.call(this, key, value);
    };
    await rejects(() => CloudSync.applyState(incoming), 'Test local quota');
    Config._write = originalWrite;
    assert(Config.getException(tz).note === 'Edited during IndexedDB', 'Failed config commit lost local data');
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Failed config commit left cloud datasets');
    passed.push('Local settings commit failure rolls back datasets and in-memory settings');

    const link = CloudSync.teamJoinLink();
    const storageSource = await (await localFetch('../js/storage.js')).text();
    const values = new Map(), testLocation = new URL(link);
    let stripped = '';
    const isolated = new Function('Config', 'Util', 'localStorage', 'window', 'document', 'location', 'history', storageSource + '\nreturn CloudSync;')(
      Config, Util,
      { getItem: k => values.get(k) || null, setItem: (k, v) => values.set(k, v), removeItem: k => values.delete(k) },
      { addEventListener() {}, dispatchEvent() {} }, { addEventListener() {} }, testLocation,
      { replaceState: (data, title, path) => { stripped = path; } }
    );
    assert(isolated.url() === CloudSync.url() && isolated.apiToken() === 'test-token' && isolated.passcode() === 'test-school-pass', 'Join link settings not restored');
    assert(stripped === testLocation.pathname + testLocation.search, 'Join secrets left in address bar');
    passed.push('Base64url team onboarding saves settings and immediately strips secrets from hash');

    const appSource = await (await localFetch('../js/app.js')).text();
    const ui = document.createElement('div');
    ui.innerHTML = '<div id="cloudBody"></div><div id="syncStatus"></div><div id="cloudConflict" hidden></div>';
    document.body.appendChild(ui);
    let parsedRoster, allowConfirm = false;
    const confirmations = [];
    const testDocument = new Proxy(document, { get(target, key) {
      if (key === 'readyState') return 'loading';
      if (key === 'addEventListener') return () => {};
      const value = Reflect.get(target, key);
      return typeof value === 'function' ? value.bind(target) : value;
    } });
    const testStore = { trainees: new Map() };
    const app = new Function('Util', 'Config', 'CloudSync', 'document', 'parseExcelFile', 'confirm', 'Store', appSource + '\nreturn App;')(
      Util, Config, CloudSync, testDocument, async () => parsedRoster,
      message => { confirmations.push(message); return allowConfirm; }, testStore
    );
    app.renderCloudCard();
    assert(document.getElementById('cloudToken').type === 'password', 'Token field not masked');
    assert(document.querySelector('[data-act="cloudJoinLink"]'), 'Missing join button');
    CloudSync._conflict({ rev: 99 });
    app.renderSync();
    assert(!document.getElementById('cloudConflict').hidden, 'Conflict prompt hidden');
    let uiPushes = 0, uiToasts = [];
    app.cloudRefresh = async () => 'kept-local';
    app.toast = message => uiToasts.push(message);
    const realPush = CloudSync.pushCloudState;
    CloudSync.pushCloudState = async () => { uiPushes++; return {}; };
    try { await app.acts.cloudSync.call(app); } finally { CloudSync.pushCloudState = realPush; }
    assert(uiPushes === 0 && uiToasts.length === 0, 'UI pushed or reported success after kept-local');
    passed.push('Settings token masking/join button/conflict prompt; UI stops after kept-local without false success');

    const hostileId = '"><b data-id-probe>marker</b><i title="';
    testStore.trainees.set(hostileId, { tz: hostileId, name: 'Test', classKey: 'י1' });
    app.getEval = () => ({});
    app.openExceptionModal(hostileId);
    assert(!document.querySelector('#modal-root [data-id-probe]') && document.querySelector('#modal-root p').textContent.includes(hostileId), 'Modal ID became HTML');
    assert([...document.querySelectorAll('#modal-root [data-tz]')].every(el => el.dataset.tz === hostileId), 'Modal ID escaped its attribute');
    const realReconcile = Config.reconcile;
    Config.reconcile = () => ({ missing: [{ tz: hostileId }] });
    try { app.acts.showMissing.call(app, { dataset: { key: 'groupsData' } }); } finally { Config.reconcile = realReconcile; }
    assert(!document.querySelector('#modal-root [data-id-probe]') && document.querySelector('#modal-root tbody .tz-col').textContent === hostileId && document.querySelector('#modal-root [data-tz]').dataset.tz === hostileId, 'Missing-student ID became HTML or an attribute');
    app.closeModal();
    passed.push('Hostile student IDs remain text in modal headers/table cells and cannot escape data-tz attributes');

    app.afterDataChange = () => {};
    const row = (id, grade, homeroom) => ({ tz: Util.normId(id), grade, homeroom, firstName: 'Test', lastName: 'Student', track: 'רגילה' });
    const originalRoster = [row('123', 'י', 'י1'), row('222', 'יא', 'יא1'), row('333', 'יב', 'יב1')];
    Config.setRoster(originalRoster, 'old.csv'); stopTimer();
    parsedRoster = { rows: [row('123', 'י', 'י2'), row('444', 'יא', 'יא2')], ignoredIds: [], warnings: [], sheets: ['Sheet'], skipped: 0, duplicates: 0 };
    const diff = Config.rosterDiff(parsedRoster.rows);
    assert(diff.added === 1 && diff.removed === 2 && diff.changed === 1 && diff.missingGrades.join() === 'יב', 'Roster diff incorrect');
    assert(diff.grades.every(g => g.current === 1) && diff.grades[2].incoming === 0, 'Grade counts incorrect');
    const originalEntry = Config.getRosterEntry();
    let importing = app.importRoster({ name: 'partial.csv' });
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(Config.getRosterEntry() === originalEntry && document.querySelector('#modal-root [role="alert"]'), 'Roster saved before warning');
    assert(document.querySelector('[data-choice="merge"]') && document.querySelector('[data-choice="replace"]'), 'Missing explicit merge/replace choices');
    app.closeModal();
    assert(await importing === false && Config.getRosterEntry() === originalEntry, 'Cancel changed roster');
    importing = app.importRoster({ name: 'partial.csv' });
    await new Promise(resolve => setTimeout(resolve, 0));
    app.acts.rosterImportChoice.call(app, { dataset: { choice: 'merge' } });
    assert(await importing, 'Merge import failed');
    let merged = Config.getRosterEntry().data;
    assert(merged.length === 3 && merged.some(r => r.tz === Util.normId('333')) && !merged.some(r => r.tz === Util.normId('222')) && merged.find(r => r.tz === tz).homeroom === 'י2', 'Partial-grade merge lost or retained wrong students');
    const moved = Config.mergeRosterGrades([row('333', 'י', 'י3')]);
    assert(moved.filter(r => r.tz === Util.normId('333')).length === 1 && moved.find(r => r.tz === Util.normId('333')).grade === 'י', 'Moved student duplicated across preserved grade');
    Config.setRoster(originalRoster, 'old.csv'); stopTimer();
    importing = app.importRoster({ name: 'partial.csv' });
    await new Promise(resolve => setTimeout(resolve, 0));
    app.acts.rosterImportChoice.call(app, { dataset: { choice: 'replace' } });
    assert(await importing && Config.getRosterEntry().data.length === 2, 'Full replacement did not remove missing grade');
    parsedRoster = { ...parsedRoster, rows: originalRoster };
    importing = app.importRoster({ name: 'complete.csv' });
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(!document.querySelector('[data-choice="merge"]') && document.querySelector('[data-choice="replace"]').textContent === 'אשר החלפת מצבת', 'Complete import did not show normal replacement confirmation');
    app.closeModal(); await importing;
    importing = app.importRoster({ name: 'complete.csv' });
    await new Promise(resolve => setTimeout(resolve, 0));
    Config.setRoster([row('999', 'יב', 'יב2')], 'concurrent.csv'); stopTimer();
    const concurrentRoster = Config.getRosterEntry();
    app.acts.rosterImportChoice.call(app, { dataset: { choice: 'replace' } });
    assert(await importing === false && Config.getRosterEntry() === concurrentRoster, 'Stale roster confirmation overwrote a concurrent update');
    Config.setRoster(parsedRoster.rows.slice(0, 2), 'backup-fixture.csv'); stopTimer();
    passed.push('Roster diff counts; cancel; missing-grade warning; merge/replace choices; cross-grade deduplication');

    ui.insertAdjacentHTML('beforeend', '<button id="btnResetConfig"></button>');
    app.bindEvents();
    const beforeReset = JSON.stringify(Config.data);
    document.getElementById('btnResetConfig').click();
    assert(JSON.stringify(Config.data) === beforeReset && confirmations.at(-1).includes('rosterOverrides') && confirmations.at(-1).includes('לענן'), 'Reset did not warn or respect cancellation');
    let readBackup = false;
    await app.chgs.backupImport.call(app, { files: [{ text: () => { readBackup = true; return '{}'; } }], value: 'config.json' });
    assert(!readBackup && confirmations.at(-1).includes('config.json') && confirmations.at(-1).includes('לענן'), 'Backup import did not confirm before reading/applying');
    let wiped = false;
    const realWipe = CloudSync.wipeLocalSession;
    CloudSync.wipeLocalSession = async () => { wiped = true; };
    try { await app.acts.cloudWipeLocal.call(app); } finally { CloudSync.wipeLocalSession = realWipe; }
    assert(!wiped && confirmations.at(-1).includes('הנתונים של בית הספר בענן לא יימחקו ויישארו שמורים') && !/localStorage|IndexedDB/.test(confirmations.at(-1)), 'Local wipe did not warn or respect cancellation');
    passed.push('Reset, config/backup import and shared-computer wipe warn explicitly and respect Cancel');

    const nativeCreate = URL.createObjectURL, nativeClick = HTMLAnchorElement.prototype.click;
    let backupBlob;
    URL.createObjectURL = blob => { backupBlob = blob; return 'blob:' + location.origin + '/test-backup'; };
    HTMLAnchorElement.prototype.click = () => {};
    try { await CloudSync.exportBackup(); } finally { URL.createObjectURL = nativeCreate; HTMLAnchorElement.prototype.click = nativeClick; }
    const backupText = await backupBlob.text(), envelope = JSON.parse(backupText);
    assert(envelope.enc === 'aes2' && !backupText.includes('"rosterData"') && !backupText.includes('"studentMeta"'), 'Local backup exposes plaintext records');
    const backupState = await CloudSync.open(envelope);
    assert(backupState.rosterData.data.length === 2 && backupState.mappingProfiles, 'Encrypted backup missing state');
    Config.setException(tz, { note: 'Temporary local note' }); stopTimer();
    assert(await CloudSync.importBackup(backupText) === 'full', 'Encrypted backup not detected');
    assert(Config.getException(tz).note === (backupState.studentMeta[tz]?.note || ''), 'Encrypted backup not applied');
    const beforeWrongPass = JSON.stringify(Config.data);
    CloudSync._set('pass', 'wrong-pass');
    await rejects(() => CloudSync.importBackup(backupText), 'קוד בית-ספר');
    assert(JSON.stringify(Config.data) === beforeWrongPass, 'Wrong-pass backup modified local data');
    CloudSync._set('pass', '');
    await rejects(() => CloudSync.importBackup(backupText), "קובץ הגיבוי מוצפן — יש להזין את קוד בית-הספר למעלה וללחוץ על 'שמירת הגדרות' לפני השחזור.");
    assert(JSON.stringify(Config.data) === beforeWrongPass, 'Backup without a passcode modified local data');
    CloudSync._set('pass', 'test-school-pass');
    assert(await CloudSync.importBackup(JSON.stringify(backupState)) === 'full', 'Plaintext full backup compatibility lost');
    assert(await CloudSync.importBackup(JSON.stringify(Config.exportObject())) === 'legacy', 'Legacy config compatibility lost');
    const legacyIv = crypto.getRandomValues(new Uint8Array(12));
    const legacyBackup = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: legacyIv }, await CloudSync._key(CloudSync.passcode(), salt, 100000), new TextEncoder().encode(JSON.stringify(backupState)));
    assert(await CloudSync.importBackup(JSON.stringify({ enc: 'aes1', salt: CloudSync._b64(salt), iv: CloudSync._b64(legacyIv), data: CloudSync._b64(legacyBackup) })) === 'full', 'Legacy encrypted backup import failed');
    CloudSync._set('pass', '');
    URL.createObjectURL = blob => { backupBlob = blob; return 'blob:' + location.origin + '/test-backup'; };
    HTMLAnchorElement.prototype.click = () => {};
    try { await CloudSync.exportBackup(); } finally { URL.createObjectURL = nativeCreate; HTMLAnchorElement.prototype.click = nativeClick; }
    assert(JSON.parse(await backupBlob.text()).app === 'schoolDashboard', 'No-pass local backup compatibility lost');
    CloudSync._set('pass', 'test-school-pass');
    stopTimer();
    passed.push('Encrypted local backup round trip; wrong-pass safety; aes1/plaintext/config compatibility');
    ui.remove();

    const wipeValues = new Map([
      ['sd.cloud.url', 'https://cloud-sync.test/exec'], ['sd.cloud.token', 'test-token'],
      ['sd.cloud.passcode', 'test-pass'], ['sd.cloud.meta', '{"dirty":true}'],
      ['sd.config.v2', '{}'], ['sd.future-key', 'delete'], ['masterRoster', '{}'], ['unrelated', 'keep']
    ]);
    let wipeSync, reloaded = false, startedRequest, requestCount = 0, aborted = false, timerFired = false;
    const deleted = [], writesDuringWipe = [];
    const requestStarted = new Promise(resolve => { startedRequest = resolve; });
    const wipeStorage = {
      get length() { return wipeValues.size; }, key: i => [...wipeValues.keys()][i],
      getItem: k => wipeValues.get(k) || null, removeItem: k => wipeValues.delete(k),
      setItem: (k, v) => { if (wipeSync?._wiping) writesDuringWipe.push(k); wipeValues.set(k, v); }
    };
    const wipeConfig = {
      KEYS: Config.KEYS, DATASET_KEYS: Config.DATASET_KEYS, ready: Promise.resolve(),
      _cache: {}, defaults: () => Config.defaults(), _invalidateRoster() {},
      _write: Config._write, _storePut: Config._storePut,
      _storeDelete: async key => { assert(wipeSync._suppress > 0, 'Wipe not suppressed before storage access'); deleted.push(key); wipeSync.markDirty(); }
    };
    wipeSync = new Function('Config', 'Util', 'localStorage', 'window', 'document', 'location', 'history', 'fetch', storageSource + '\nreturn CloudSync;')(
      wipeConfig, Util, wipeStorage, { addEventListener() {}, dispatchEvent() {} }, { addEventListener() {} },
      { hash: '', reload: () => { reloaded = true; } }, {},
      (url, opts) => {
        requestCount++; startedRequest();
        return new Promise((resolve, reject) => opts.signal.addEventListener('abort', () => { aborted = true; reject(new DOMException('Aborted', 'AbortError')); }));
      }
    );
    wipeSync.buildState = () => ({ app: 'schoolDashboard' });
    wipeSync.seal = async () => ({ enc: 'aes2', data: 'mock' });
    const activePush = wipeSync.pushCloudState({ force: true }).catch(e => e);
    await requestStarted;
    const queuedPush = wipeSync.pushCloudState({ force: true }).catch(e => e);
    wipeSync._timer = setTimeout(() => { timerFired = true; }, 20);
    await wipeSync.wipeLocalSession();
    await Promise.all([activePush, queuedPush]);
    await new Promise(resolve => setTimeout(resolve, 30));
    assert(aborted && requestCount === 1 && !timerFired && !writesDuringWipe.length, 'Wipe allowed queued/late writes or uploads');
    assert(reloaded && deleted.length === Config.DATASET_KEYS.length && wipeValues.size === 1 && wipeValues.get('unrelated') === 'keep', 'Wipe missed dashboard storage or removed unrelated data');
    assert(!wipeConfig._write('sd.config.v2', {}).ok && !(await wipeConfig._storePut('groupsData', { data: [] })).ok, 'A late file import could repopulate storage after wipe');
    await rejects(() => wipeSync.pushCloudState({ force: true }), 'הסנכרון חסום');
    reloaded = false;
    wipeConfig._storeDelete = async () => { throw new Error('Test deletion failure'); };
    await rejects(() => wipeSync.wipeLocalSession(), 'Test deletion failure');
    assert(!reloaded && wipeSync._wiping && wipeSync._suppress > 0, 'Failed wipe resumed syncing or reloaded as if successful');
    passed.push('Shared-computer wipe suppresses events, cancels requests/timers, blocks queued pushes and preserves unrelated keys');

    await CloudSync.applyState({ ...state, rosterData: null, groupsData: null, bagrutData: null, sadinData: null });
    assert(Config.getRosterEntry() === null && Config.isRosterCleared(), 'Roster deletion failed');
    for (const key of Config.DATASET_KEYS) assert(Config.getDataset(key) === null && !(await Config._storeGet(key)), 'Dataset deletion failed');
    passed.push('Cloud deletions persist for roster and all datasets');

    const serverSource = await (await localFetch('../cloud/Code.gs')).text();
    const props = new Map([['API_TOKEN', 'server-token']]), files = new Map(), backups = [];
    let waited = 0, released = 0, nextId = 0;
    const iterator = items => { let i = 0; return { hasNext: () => i < items.length, next: () => items[i++] }; };
    const folder = { getFiles: () => iterator(backups) };
    const file = (name, initial = '') => {
      let stored = initial;
      const f = {
        getId: () => 'file-' + (++nextId), getName: () => name, getParents: () => iterator([folder]),
        getBlob: () => ({ getDataAsString: () => stored }), setContent: text => { stored = text; },
        makeCopy: (name, parent) => { assert(parent === folder, 'Wrong backup folder'); const copy = file(name, stored); backups.push(copy); return copy; },
        setTrashed: value => { f.trashed = value; }, isTrashed: () => !!f.trashed
      };
      return f;
    };
    const server = new Function('DriveApp', 'ContentService', 'MimeType', 'PropertiesService', 'LockService', serverSource + '\nreturn { doPost, doGet };')(
      {
        getFileById: id => { if (!files.has(id)) throw new Error('File inaccessible'); return files.get(id); },
        createFile: (name, content) => { const f = file(name, content); const id = f.getId(); f.getId = () => id; files.set(id, f); return f; },
        getRootFolder: () => folder,
        getFilesByName: name => iterator([...files.values()].filter(f => f.getName() === name))
      },
      { MimeType: { JSON: 'json' }, createTextOutput: text => ({ setMimeType: () => JSON.parse(text) }) },
      { PLAIN_TEXT: 'text' },
      { getScriptProperties: () => ({ getProperty: k => props.get(k) || null, setProperty: (k, v) => props.set(k, v), setProperties: obj => Object.entries(obj).forEach(([k, v]) => props.set(k, v)) }) },
      { getScriptLock: () => ({ waitLock: ms => { assert(ms === 20000, 'Wrong lock timeout'); waited++; }, releaseLock: () => { released++; } }) }
    );
    const post = body => server.doPost({ postData: { contents: JSON.stringify(body) } });
    assert(server.doGet({}).error === 'Use POST with token', 'GET exposes data');
    for (const action of ['meta', 'pull', 'push']) assert(post({ action }).error === 'Unauthorized', action + ' allowed missing token');
    props.delete('API_TOKEN');
    assert(post({ action: 'meta' }).error === 'Server token not configured', 'Missing server token accepted');
    props.set('API_TOKEN', 'server-token');
    const payload = { enc: 'aes2', salt: 'test', iv: 'test', data: 'test' };
    let response = post({ action: 'push', token: 'server-token', baseRev: 0, updatedAt: 1, payload });
    assert(response.ok && response.rev === 1 && response.updatedAt > 1 && files.size === 1 && props.get('FILE_ID'), 'Initial server push incorrect');
    const today = new Date().toISOString().slice(0, 10);
    backups.push(file('school-dashboard-backup-2000-01-01.json'), file('unrelated.json'));
    assert(post({ action: 'push', token: 'server-token', baseRev: 0, payload }).conflict, 'Stale revision accepted');
    response = post({ action: 'push', token: 'server-token', baseRev: 1, payload });
    assert(response.rev === 2 && backups.length === 3 && backups[0].trashed && !backups[1].trashed, 'Daily backup or pruning failed');
    assert(backups[2].getName() === 'school-dashboard-backup-' + today + '.json' && JSON.parse(backups[2].getBlob().getDataAsString()).rev === 1, 'Backup was not pre-overwrite content');
    assert(props.get('LAST_BACKUP_DAY') === today, 'Backup day not persisted');
    post({ action: 'push', token: 'server-token', baseRev: 0, force: true, payload });
    assert(backups.length === 3 && files.size === 1, 'Multiple daily backups or snapshot files');
    assert(post({ action: 'meta', token: 'server-token' }).rev === 3, 'Meta revision wrong');
    assert(post({ action: 'pull', token: 'server-token' }).payload.data === payload.data, 'Pull changed payload');
    props.set('FILE_ID', 'inaccessible');
    assert(!post({ action: 'pull', token: 'server-token' }).ok && files.size === 1, 'Inaccessible configured file silently replaced');
    assert(waited === released, 'Lock not released on every path');
    passed.push('Apps Script: auth, POST-only reads, locks, fixed file, server clock, conflicts, daily backups and pruning');

    const addSnapshot = (content, trashed = false) => {
      const f = file('school-dashboard-snapshot.json', content), id = 'drive-' + (++nextId);
      f.getId = () => id; f.trashed = trashed; files.set(id, f);
      return f;
    };
    const stored = JSON.stringify({ rev: 3, updatedAt: 5, payload });
    props.delete('FILE_ID'); props.set('REV', '3'); files.clear();
    response = post({ action: 'pull', token: 'server-token' });
    assert(response.ok && response.payload === null && files.size === 0 && !props.get('FILE_ID'), 'Pull without FILE_ID created a file');
    response = post({ action: 'push', token: 'server-token', baseRev: 3, payload });
    assert(response.ok && files.size === 1 && props.get('FILE_ID') === [...files.keys()][0], 'Zero existing snapshots did not create and persist a new file');

    props.delete('FILE_ID'); props.set('REV', '3'); files.clear();
    const existing = addSnapshot(stored);
    addSnapshot('{"deleted":true}', true);
    response = post({ action: 'pull', token: 'server-token' });
    assert(response.ok && response.payload.data === payload.data && props.get('FILE_ID') === existing.getId() && files.size === 2, 'Single existing snapshot was not adopted');
    props.delete('FILE_ID');
    response = post({ action: 'push', token: 'server-token', baseRev: 3, payload: { ...payload, data: 'adopted' } });
    assert(response.ok && files.size === 2 && props.get('FILE_ID') === existing.getId() && JSON.parse(existing.getBlob().getDataAsString()).payload.data === 'adopted', 'Push created a new file instead of using the single existing snapshot');

    props.delete('FILE_ID'); props.set('REV', '4'); files.clear();
    const first = addSnapshot(stored), second = addSnapshot(stored);
    for (const body of [{ action: 'pull' }, { action: 'push', baseRev: 4, payload }]) {
      response = post({ token: 'server-token', ...body });
      assert(response.ok === false && response.error.includes('FILE_ID') && !props.get('FILE_ID') && files.size === 2, 'Ambiguous snapshots were guessed or a file was created for ' + body.action);
    }
    assert(first.getBlob().getDataAsString() === stored && second.getBlob().getDataAsString() === stored, 'Ambiguous snapshots were modified');
    assert(waited === released, 'Lock not released after FILE_ID migration paths');
    passed.push('Apps Script FILE_ID migration: 0 files create, 1 file adopted, >1 files rejected without guessing');

    results.textContent = passed.map(name => 'PASS ' + name).join('\n') + '\nAll tests passed.';
    document.title = 'PASS - Cloud sync regression tests';
  } catch (e) {
    results.textContent = passed.map(name => 'PASS ' + name).join('\n') + '\nFAIL ' + e.stack;
    document.title = 'FAIL - Cloud sync regression tests';
    console.error(e);
  } finally {
    stopTimer();
    Config._storePut = originalPut;
    Config._write = originalWrite;
    // Keep outbound traffic blocked after the tests finish.
    window.fetch = (url, options) => {
      if (new URL(url, location.href).origin !== location.origin) throw new Error('Outbound network blocked by tests');
      return localFetch(url, options);
    };
  }
})();
</script>
