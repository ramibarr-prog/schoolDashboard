<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cloud sync regression tests</title>
<pre id="results">Running...</pre>
<script>
// Never send cloud traffic from this test page, even if saved settings exist.
const localFetch = window.fetch.bind(window);
window.fetch = (url, options) => {
  const target = new URL(url, location.href);
  if (target.origin !== location.origin) throw new Error('Outbound network blocked by tests');
  return localFetch(target, options);
};
</script>
<script id="googleIdentityScript"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/views/profileView.js"></script>
<script src="../js/views/sadinView.js"></script>
<script src="../js/views/rulesView.js"></script>
<script>
(async () => {
  const results = document.getElementById('results'), passed = [];
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const clone = value => JSON.parse(JSON.stringify(value));
  const rejects = async (fn, text) => {
    let error;
    try { await fn(); } catch (e) { error = e; }
    assert(error && (!text || error.message.includes(text)), 'Expected rejection: ' + text);
  };
  const originalPut = Config._storePut, originalWrite = Config._write;
  const token = 'header.' + btoa(JSON.stringify({ email: 'teacher@example.test', aud: Config.GOOGLE_CLIENT_ID, exp: Math.floor(Date.now() / 1000) + 3600 })) + '.signature';
  const tz = '000000123';
  let posts = [], remote = { ok: true, rev: 0, updatedAt: 0, payload: null }, failPull = false, failPush = false, authError = '', holdPull = null, holdPost = null;
  const stopTimer = () => clearTimeout(CloudSync._timer);
  try {
    await Config.ready;
    let googleReady = 0;
    const onGoogleReady = () => { googleReady++; };
    window.addEventListener('sd:google-ready', onGoogleReady);
    document.getElementById('googleIdentityScript').dispatchEvent(new Event('load'));
    assert(googleReady === 1, 'Delayed GIS load was not announced without an onboarding link');
    CloudSync.saveSettings({ clientId: 'another-client' });
    assert(googleReady === 2, 'Changing client ID while signed out did not refresh GIS');
    CloudSync.saveSettings({ clientId: '' });
    window.removeEventListener('sd:google-ready', onGoogleReady);
    CloudSync.saveSettings({ url: 'https://cloud-sync.test/exec', passcode: 'test-school-pass' });
    CloudSync.acceptGoogleCredential(token);
    assert(!Object.keys(localStorage).some(key => String(localStorage.getItem(key)).includes(token)), 'ID token persisted to localStorage');
    window.fetch = async (url, options = {}) => {
      assert(url === 'https://cloud-sync.test/exec', 'Unexpected outbound request blocked');
      assert(options.method === 'POST' && !url.includes('token='), 'Only POST allowed');
      const body = JSON.parse(options.body);
      assert(body.idToken === token && !('token' in body), 'Missing Google ID token or legacy token sent');
      posts.push(body);
      if (authError) return { ok: true, json: async () => ({ ok: false, error: authError }) };
      if (body.action === 'meta') return { ok: true, json: async () => ({ ...remote, payload: undefined }) };
      if (body.action === 'pull') {
        if (failPull) throw new Error('Test offline');
        const snapshot = clone(remote);
        if (holdPull) await holdPull;
        return { ok: true, json: async () => snapshot };
      }
      if (holdPost) await holdPost;
      if (failPush) return { ok: true, json: async () => ({ ok: false, error: 'invalid_envelope' }) };
      if (body.baseRev !== remote.rev && !body.force) return { ok: true, json: async () => ({ ok: false, conflict: true, rev: remote.rev, updatedAt: remote.updatedAt }) };
      remote = { ok: true, rev: remote.rev + 1, updatedAt: Date.now(), payload: body.payload };
      return { ok: true, json: async () => ({ ok: true, rev: remote.rev, updatedAt: remote.updatedAt }) };
    };
    CloudSync._setMeta({ dirty: false, rev: 0, syncedAt: 0 });
    await CloudSync.pullCloudState();
    assert(Config.setRoster([{ tz, firstName: 'Test', lastName: 'Student', grade: 'י', homeroom: 'י1', track: 'רגילה' }], 'roster.csv').ok, 'Roster save');
    for (const key of Config.DATASET_KEYS) {
      assert((await Config.setDataset(key, [{ tz, gradeKey: 'י', score: 80, cls: { kind: 'fail', block: true } }], key + '.csv')).ok, 'Dataset save');
    }
    Config.setException(tz, { note: 'Local note' });
    stopTimer();
    await CloudSync.pushCloudState();
    assert(!CloudSync.hasUnpublished() && CloudSync.meta().rev === 1, 'Revision not persisted');
    assert(remote.payload.enc === 'aes2', 'Push was not aes2');
    assert((await CloudSync.open(remote.payload)).studentMeta[tz].note === 'Local note', 'Encrypted round trip');
    passed.push('Authenticated POST pull/push; aes2 round trip and persisted server revision');

    CloudSync._setMeta({ dirty: true });
    authError = 'token_expired';
    await rejects(() => CloudSync._post({ action: 'meta' }), 'להתחבר מחדש');
    assert(!CloudSync.identity() && CloudSync.hasUnpublished(), 'Expired server token retained identity or lost local edits');
    authError = '';
    CloudSync.acceptGoogleCredential(token);
    CloudSync._setMeta({ dirty: false });
    passed.push('Expired server token clears RAM identity and retains unpublished local changes');

    CloudSync._set('pass', '');
    await rejects(() => CloudSync.seal({}), 'קוד בית-ספר');
    await rejects(() => CloudSync.open({ enc: 'none', data: '{}' }), 'אינם מוצפנים');
    const savedRemote = remote;
    remote = { ...remote, payload: { enc: 'none', data: '{}' } };
    await rejects(() => CloudSync.pullCloudState({ force: true }), 'אינם מוצפנים');
    remote = savedRemote;
    CloudSync._set('pass', 'test-school-pass');
    await rejects(() => CloudSync.open({ enc: 'none', data: '{}' }), 'אינם מוצפנים');
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const legacy = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await CloudSync._key(CloudSync.passcode(), salt, 100000), new TextEncoder().encode('{"legacy":true}'));
    assert((await CloudSync.open({ enc: 'aes1', salt: CloudSync._b64(salt), iv: CloudSync._b64(iv), data: CloudSync._b64(legacy) })).legacy, 'Legacy aes1 failed');
    const independentKey = await CloudSync._key(CloudSync.passcode(), CloudSync._unb64(remote.payload.salt), 600000);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: CloudSync._unb64(remote.payload.iv) }, independentKey, CloudSync._unb64(remote.payload.data));
    passed.push('Mandatory passcode; plaintext rejection; aes1 compatibility; aes2 uses 600,000 iterations');

    const state = await CloudSync.open(remote.payload);
    remote = { ...remote, rev: 2, updatedAt: Date.now() + 1 };
    Config.setException(tz, { note: 'Keep local' }); stopTimer();
    CloudSync._ready = false;
    let before = posts.filter(p => p.action === 'push').length;
    assert(await CloudSync.pushCloudState() === 'kept-local', 'Initial pull did not preserve local');
    assert(posts.filter(p => p.action === 'push').length === before && CloudSync.status.kind === 'conflict', 'Push followed kept-local');
    assert(Config.getException(tz).note === 'Keep local', 'Local note lost');
    passed.push('kept-local stops initial push and exposes conflict without overwriting');

    assert(await CloudSync.pullCloudState({ force: true }) === 'applied', 'Conflict pull failed');
    assert(Config.getException(tz).note === 'Local note' && CloudSync.meta().rev === 2, 'Pull resolution failed');
    Config.setException(tz, { note: 'Conflict again' }); stopTimer();
    remote.rev = 3;
    assert(await CloudSync.pushCloudState() === 'kept-local' && CloudSync.hasUnpublished(), 'Stale baseRev was accepted');
    await CloudSync.pushCloudState({ force: true });
    assert(posts.at(-1).force === true && !CloudSync.hasUnpublished() && CloudSync.meta().rev === 4, 'Force resolution failed');
    passed.push('Server conflict preserves dirty data; explicit pull and force-push resolution');

    const tabPushes = () => posts.filter(p => p.action === 'push');
    assert(CloudSync._tabRev === 4 && CloudSync.meta().rev === 4, 'Tab revision not tracking successful sync');
    // Another tab syncs rev 5 and updates the shared localStorage while this tab's memory is still at rev 4.
    remote = { ...remote, rev: 5, updatedAt: Date.now() + 5 };
    CloudSync._setMeta({ rev: 5, syncedAt: remote.updatedAt });
    assert(await CloudSync.pullCloudState() === 'applied' && CloudSync._tabRev === 5, 'Stale tab treated another tab revision as already synced');
    remote = { ...remote, rev: 6, updatedAt: Date.now() + 6 };
    CloudSync._setMeta({ rev: 6, syncedAt: remote.updatedAt });
    const remoteBeforeStalePush = remote.payload;
    Config.setException(tz, { note: 'Stale tab edit' }); stopTimer();
    const pushesBefore = tabPushes().length;
    assert(await CloudSync.pushCloudState() === 'kept-local', 'Stale tab push was not stopped');
    assert(tabPushes().length === pushesBefore + 1 && tabPushes().at(-1).baseRev === 5 && !tabPushes().at(-1).force, 'Stale tab sent the shared localStorage revision');
    assert(remote.rev === 6 && remote.payload === remoteBeforeStalePush && CloudSync.status.kind === 'conflict' && CloudSync.hasUnpublished() && CloudSync._tabRev === 5, 'Stale tab overwrote or acknowledged the other tab revision');
    await CloudSync.pushCloudState({ force: true });
    assert(CloudSync._tabRev === 7 && remote.rev === 7 && CloudSync.meta().rev === 7 && !CloudSync.hasUnpublished(), 'Force push did not refresh the tab revision');
    passed.push('Two tabs: stale tab sends its own baseRev, stops on conflict, and only advances after its own pull/push');

    let releasePost, enteredPost;
    const enteredUpload = new Promise(resolve => { enteredPost = resolve; });
    const fetchBeforeHold = window.fetch;
    holdPost = new Promise(resolve => { releasePost = resolve; });
    window.fetch = async (url, options) => {
      if (JSON.parse(options.body).action === 'push') enteredPost();
      return fetchBeforeHold(url, options);
    };
    Config.setException(tz, { note: 'First upload' }); stopTimer();
    const uploading = CloudSync.pushCloudState();
    await enteredUpload;
    Config.setException(tz, { note: 'Edited during upload' }); stopTimer();
    releasePost();
    await uploading;
    holdPost = null;
    assert(CloudSync.hasUnpublished(), 'Earlier upload cleared newer local edits');
    const deadline = Date.now() + 10000;
    while (CloudSync.hasUnpublished()) {
      assert(Date.now() < deadline, 'Follow-up autosync timed out');
      await new Promise(resolve => setTimeout(resolve, 20));
    }
    assert((await CloudSync.open(remote.payload)).studentMeta[tz].note === 'Edited during upload', 'Follow-up autosync lost note');
    window.fetch = fetchBeforeHold;
    passed.push('Concurrent upload edits remain dirty and debounce into a follow-up encrypted upload');

    const localRev = CloudSync.meta().rev;
    remote.rev++;
    const visibilityDescriptor = Object.getOwnPropertyDescriptor(document, 'visibilityState');
    Object.defineProperty(document, 'visibilityState', { configurable: true, value: 'visible' });
    try {
      document.dispatchEvent(new Event('visibilitychange'));
      await CloudSync._queue;
    } finally {
      if (visibilityDescriptor) Object.defineProperty(document, 'visibilityState', visibilityDescriptor);
      else delete document.visibilityState;
    }
    assert(CloudSync.status.kind === 'conflict' && CloudSync.meta().rev === localRev, 'Visibility meta warning incorrectly acknowledged server data');
    let unload = new Event('beforeunload', { cancelable: true });
    CloudSync._setMeta({ dirty: true });
    window.dispatchEvent(unload);
    assert(unload.defaultPrevented, 'Missing unload warning');
    passed.push('New server revision warns without advancing local revision; dirty unload is prevented');

    failPush = true;
    await rejects(() => CloudSync.pushCloudState({ force: true }), 'מעטפת ההצפנה');
    assert(CloudSync.hasUnpublished() && CloudSync.status.kind === 'error', 'Write error lost dirty data');
    failPush = false;
    CloudSync._ready = false; failPull = true;
    before = posts.filter(p => p.action === 'push').length;
    await rejects(() => CloudSync.pushCloudState(), 'Test offline');
    assert(posts.filter(p => p.action === 'push').length === before, 'Push followed read failure');
    failPull = false;
    passed.push('Failed read blocks writes; failed write exposes errors and preserves pending data');

    let releasePull;
    holdPull = new Promise(resolve => { releasePull = resolve; });
    const pulling = CloudSync.pullCloudState({ force: true });
    await new Promise(resolve => setTimeout(resolve, 20));
    Config.setException(tz, { note: 'Edited while downloading' }); stopTimer();
    releasePull();
    assert(await pulling === 'kept-local', 'Concurrent download edit overwritten');
    holdPull = null;
    assert(Config.getException(tz).note === 'Edited while downloading', 'Concurrent note lost');
    passed.push('Forced pull preserves edits made during download');

    const bad = clone(state);
    bad.rosterData.data[0].tz = '123';
    bad.groupsData.data.push(null, [], 'invalid', { tz: { unexpected: true } });
    bad.studentMeta = { '123': { note: 'Normalized', isException: 'false', reason: {} }, bad: null };
    bad.rosterOverrides = { '123': { tz: '<script>', note: {}, hidden: 'false', homeroom: [] } };
    const clean = sanitizeState(bad);
    assert(clean.rosterData.data[0].tz === tz && clean.groupsData.data.length === 1, 'Rows not sanitized');
    assert(clean.studentMeta[tz].note === 'Normalized' && !clean.studentMeta[tz].isException && clean.studentMeta[tz].reason === '', 'Metadata types invalid');
    assert(clean.rosterOverrides[tz].tz === tz && !clean.rosterOverrides[tz].hidden && clean.rosterOverrides[tz].note === '', 'Override types invalid');
    assert(clean.bagrutData.data[0].cls.kind === 'fail' && clean.bagrutData.data[0].cls.block, 'Blocking grade changed');
    await rejects(() => CloudSync.applyState({ ...state, groupsData: 17 }), 'groupsData');
    passed.push('Untrusted rows, IDs, metadata and override types sanitized; grade semantics preserved');

    const mapFields = {
      rosterOverrides: 'rosterOverrides', studentMeta: 'traineeExceptions', classNicknames: 'classNicknames',
      specialEdClasses: 'specialEdClasses', rosterMismatchDismissed: 'rosterMismatchDismissed'
    };
    const savedMaps = Object.fromEntries(Object.values(mapFields).map(key => [key, clone(Config.data[key])]));
    const localMaps = {
      rosterOverrides: { [tz]: { tz, note: 'local' } }, traineeExceptions: { [tz]: { note: 'local' } },
      classNicknames: { 'י1': 'local' }, specialEdClasses: { 'י1': true }, rosterMismatchDismissed: { [tz]: 'local' }
    };
    Object.assign(Config.data, clone(localMaps));
    const sparse = { app: 'schoolDashboard', studentMeta: undefined };
    const cleanSparse = sanitizeState(sparse);
    for (const key of Object.keys(mapFields)) assert(!(key in cleanSparse), 'Missing field added: ' + key);
    await CloudSync.applyState(sparse);
    for (const key of Object.values(mapFields)) assert(JSON.stringify(Config.data[key]) === JSON.stringify(localMaps[key]), 'Missing field cleared local data: ' + key);
    const emptyMaps = Object.fromEntries(Object.keys(mapFields).map(key => [key, {}]));
    await CloudSync.applyState({ app: 'schoolDashboard', ...emptyMaps });
    for (const key of Object.values(mapFields)) assert(JSON.stringify(Config.data[key]) === '{}', 'Explicit empty map not applied: ' + key);
    Object.assign(Config.data, savedMaps);
    passed.push('Missing snapshot maps preserve local settings while explicit empty maps clear them');

    const previousData = JSON.stringify(Config.data), previousRoster = JSON.stringify(Config.getRosterEntry());
    let previousDataset = clone(Config.getDataset('groupsData'));
    let failOnce = true;
    Config._storePut = async function(key, entry) {
      if (key === 'sadinData' && failOnce) { failOnce = false; return { ok: false, error: 'Test quota' }; }
      return originalPut.call(this, key, entry);
    };
    const incoming = { ...state, classNicknames: { new: 'Cloud name' }, groupsData: { data: [], uploadedAt: 1, fileName: 'cloud' } };
    await rejects(() => CloudSync.applyState(incoming), 'Test quota');
    assert(JSON.stringify(Config.data) === previousData && JSON.stringify(Config.getRosterEntry()) === previousRoster, 'Quota failure partially committed settings/roster');
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Partial IndexedDB write not rolled back');
    Config._storePut = originalPut;
    passed.push('IndexedDB quota failure leaves settings/roster unchanged and restores prior datasets');

    let releasePut, enteredPut;
    const entered = new Promise(resolve => { enteredPut = resolve; });
    const hold = new Promise(resolve => { releasePut = resolve; });
    let holdOnce = true;
    Config._storePut = async function(key, entry) {
      const r = await originalPut.call(this, key, entry);
      if (holdOnce) { holdOnce = false; enteredPut(); await hold; }
      return r;
    };
    const applying = CloudSync.applyState(incoming);
    await entered;
    Config.setException(tz, { note: 'Edited during IndexedDB' }); stopTimer();
    assert((await Config.setDataset('groupsData', [{ tz, groupId: 'new-local-group' }], 'new-local.csv')).ok, 'Concurrent dataset save failed');
    previousDataset = clone(Config.getDataset('groupsData'));
    stopTimer();
    releasePut();
    assert(await applying === 'kept-local', 'Concurrent IndexedDB edit not detected');
    assert(Config.getException(tz).note === 'Edited during IndexedDB' && CloudSync.hasUnpublished(), 'Concurrent IndexedDB edit dropped');
    Config._storePut = originalPut;
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Concurrent apply did not roll back');
    passed.push('Edits during applyState awaits stay dirty and prevent the cloud commit');

    let failConfigOnce = true;
    Config._write = function(key, value) {
      if (key === this.KEYS.config && failConfigOnce) { failConfigOnce = false; return { ok: false, error: 'Test local quota' }; }
      return originalWrite.call(this, key, value);
    };
    await rejects(() => CloudSync.applyState(incoming), 'Test local quota');
    Config._write = originalWrite;
    assert(Config.getException(tz).note === 'Edited during IndexedDB', 'Failed config commit lost local data');
    assert(JSON.stringify(await Config._storeGet('groupsData')) === JSON.stringify(previousDataset), 'Failed config commit left cloud datasets');
    passed.push('Local settings commit failure rolls back datasets and in-memory settings');

    let interimRev;
    const recordInterimRev = () => { interimRev = Config.rev; };
    window.addEventListener('sd:config-changed', recordInterimRev);
    Config._write = function(key, value) {
      if (key === this.KEYS.masterRoster) return { ok: false, error: 'Test roster quota' };
      return originalWrite.call(this, key, value);
    };
    try { await rejects(() => CloudSync.applyState(incoming), 'Test roster quota'); }
    finally { Config._write = originalWrite; window.removeEventListener('sd:config-changed', recordInterimRev); }
    assert(interimRev != null && Config.rev > interimRev, 'Rollback invalidates caches built during the interim config event');
    assert(Config.getException(tz).note === 'Edited during IndexedDB', 'Post-event rollback restores local settings');
    passed.push('Post-event rollback advances the configuration revision');

    const link = CloudSync.teamJoinLink();
    const storageSource = await (await localFetch('../js/storage.js')).text();
    const join = JSON.parse(new TextDecoder().decode(CloudSync._unb64(link.split('#cloud=')[1].replace(/-/g, '+').replace(/_/g, '/'))));
    assert(join.url === CloudSync.url() && !('token' in join) && !('pass' in join) && !('idToken' in join), 'Join link contains credentials');
    const values = new Map(), testLocation = new URL(link);
    let stripped = '';
    const isolated = new Function('Config', 'Util', 'localStorage', 'window', 'document', 'location', 'history', storageSource + '\nreturn CloudSync;')(
      Config, Util,
      { getItem: k => values.get(k) || null, setItem: (k, v) => values.set(k, v), removeItem: k => values.delete(k) },
      { addEventListener() {}, dispatchEvent() {} }, { addEventListener() {}, getElementById() { return null; } }, testLocation,
      { replaceState: (data, title, path) => { stripped = path; } }
    );
    assert(isolated.url() === CloudSync.url() && !isolated.passcode() && !isolated.identity() && isolated._onboarding, 'Join link must not restore credentials');
    assert(stripped === testLocation.pathname + testLocation.search, 'Join secrets left in address bar');
    for (const allow of [false, true]) {
      const old = new Map([['sd.cloud.url', 'https://old-cloud.test/exec'], ['sd.cloud.clientId', 'old-client'], ['sd.cloud.passcode', 'old-pass']]);
      let confirmCount = 0, removedHash = '';
      const existing = new Function('Config', 'Util', 'localStorage', 'window', 'document', 'location', 'history', storageSource + '\nreturn CloudSync;')(
        Config, Util,
        { getItem: k => old.get(k) || null, setItem: (k, v) => old.set(k, v), removeItem: k => old.delete(k) },
        { addEventListener() {}, dispatchEvent() {}, confirm() { confirmCount++; return allow; } },
        { addEventListener() {}, getElementById() { return null; } }, new URL(link),
        { replaceState: (data, title, path) => { removedHash = path; } }
      );
      assert(confirmCount === 1 && removedHash === testLocation.pathname + testLocation.search, 'Existing cloud URL did not prompt or strip the hash');
      assert(existing.url() === (allow ? CloudSync.url() : 'https://old-cloud.test/exec') && existing._onboarding === allow, 'Onboarding ignored confirmation');
      assert(existing.passcode() === 'old-pass' && (allow || existing.clientId() === 'old-client'), 'Onboarding lost existing credentials');
    }
    passed.push('Base64url team onboarding saves settings and immediately strips secrets from hash');

    const appSource = await (await localFetch('../js/app.js')).text();
    const indexSource = await (await localFetch('../index.html')).text();
    const indexDocument = new DOMParser().parseFromString(indexSource, 'text/html');
    const assetVersions = [...indexDocument.querySelectorAll('script[src], link[href]:not([rel="preconnect"])')]
      .map(el => new URL(el.getAttribute('src') || el.getAttribute('href'), location.href).searchParams.get('v'));
    assert(assetVersions.every(Boolean) && new Set(assetVersions).size === 1, 'Index assets do not share a cache version');
    const ui = document.createElement('div');
    ui.innerHTML = '<div id="cloudBody"></div><div id="cloudConflict" hidden></div>';
    ui.appendChild(indexDocument.getElementById('syncStatus').cloneNode(true));
    document.body.appendChild(ui);
    let parsedRoster, allowConfirm = false;
    const confirmations = [];
    const testDocument = new Proxy(document, { get(target, key) {
      if (key === 'readyState') return 'loading';
      if (key === 'addEventListener') return () => {};
      const value = Reflect.get(target, key);
      return typeof value === 'function' ? value.bind(target) : value;
    } });
    const testStore = { trainees: new Map() };
    window.Store = testStore;
    const app = new Function('Util', 'Config', 'CloudSync', 'document', 'parseExcelFile', 'confirm', 'Store', appSource + '\nreturn App;')(
      Util, Config, CloudSync, testDocument, async () => parsedRoster,
      message => { confirmations.push(message); return allowConfirm; }, testStore
    );
    app.renderCloudCard();
    assert(!document.getElementById('cloudToken') && document.getElementById('cloudPass').type === 'password', 'Legacy token field or unmasked passcode');
    const passInput = document.getElementById('cloudPass');
    assert(!passInput.value && !passInput.hasAttribute('value') && !passInput.placeholder.includes(CloudSync.passcode()), 'Saved passcode exposed in settings DOM');
    const savedPass = CloudSync.passcode(), savedToast = app.toast, savedAccess = app.syncCloudAccess;
    app.toast = () => {};
    app.syncCloudAccess = async () => {};
    try {
      await app.acts.cloudSave.call(app);
      assert(CloudSync.passcode() === savedPass, 'Blank save erased passcode');
      passInput.value = 'new-test-pass';
      await app.acts.cloudSave.call(app);
      assert(CloudSync.passcode() === 'new-test-pass' && !passInput.value, 'New passcode not saved or input not cleared');
      passInput.value = 'pending-test-pass';
      document.getElementById('cloudUrl').value = 'http://invalid.test';
      await app.acts.cloudSave.call(app);
      assert(passInput.value === 'pending-test-pass' && CloudSync.passcode() === 'new-test-pass', 'Failed save lost entered passcode');
      document.getElementById('cloudUrl').value = CloudSync.url();
      passInput.value = '';
      const clipboardDescriptor = Object.getOwnPropertyDescriptor(navigator, 'clipboard');
      Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { writeText: async () => {} } });
      try { await app.acts.cloudJoinLink.call(app); } finally {
        if (clipboardDescriptor) Object.defineProperty(navigator, 'clipboard', clipboardDescriptor);
        else delete navigator.clipboard;
      }
      assert(CloudSync.passcode() === 'new-test-pass', 'Blank join-link action erased passcode');
    } finally {
      CloudSync.saveSettings({ passcode: savedPass });
      app.toast = savedToast;
      app.syncCloudAccess = savedAccess;
    }
    assert(document.querySelector('[data-act="cloudJoinLink"]'), 'Missing join button');
    let googleCallback, googleRendered = false;
    CloudSync.signOutGoogle();
    window.google = { accounts: { id: {
      initialize: opts => { assert(opts.client_id === Config.GOOGLE_CLIENT_ID, 'Wrong GIS client ID'); googleCallback = opts.callback; },
      renderButton: element => { googleRendered = element.id === 'googleSignIn'; },
      disableAutoSelect() {}
    } } };
    app.renderCloudCard();
    assert(googleRendered && typeof googleCallback === 'function', 'Official Google button was not initialized');
    googleCallback({ credential: token });
    app.renderCloudAuth();
    assert(CloudSync.identity().email === 'teacher@example.test' && document.querySelector('[data-act="cloudGoogleSignOut"]'), 'Google identity not shown');
    delete window.google;
    CloudSync._conflict({ rev: 99 });
    app.renderSync();
    assert(!document.getElementById('cloudConflict').hidden, 'Conflict prompt hidden');
    app._cloudWriteReady = true;

    for (const bad of [{ enc: 'none', data: 'plain' }, { ...payload, iv: '' }, { ...payload, data: null }]) {
      assert(request({ action: 'push', baseRev: 0, payload: bad }).error === 'invalid_envelope', 'Invalid envelope accepted');
    }
    let response = request({ action: 'pull' });
    assert(response.error === 'file_id_missing' && !files.size, 'Missing snapshot pull created a file');
    response = request({ action: 'push', baseRev: 0, payload });
    assert(response.error === 'file_id_missing' && !files.size, 'Missing snapshot push created a file');
    assert(JSON.parse(props.get('ALLOWED_SUBS'))['teacher@gmail.com'] === 'subject-1', 'First authorized subject not bound');
    server.initCloudFile();
    response = request({ action: 'push', baseRev: 0, updatedAt: 1, payload });
    assert(response.ok && response.rev === 1 && response.updatedAt > 1 && files.size === 1 && props.get('FILE_ID'), 'Initial server push incorrect');
    const today = new Date().toISOString().slice(0, 10);
    backups.push(file('school-dashboard-backup-2000-01-01.json'), file('unrelated.json'));
    assert(request({ action: 'push', baseRev: 0, payload }).conflict, 'Stale revision accepted');
    response = request({ action: 'push', baseRev: 1, payload });
    assert(response.rev === 2 && backups.length === 3 && backups[0].trashed && !backups[1].trashed, 'Daily backup or pruning failed');
    assert(backups[2].getName() === 'school-dashboard-backup-' + today + '.json' && JSON.parse(backups[2].getBlob().getDataAsString()).rev === 1, 'Backup was not pre-overwrite content');
    assert(props.get('LAST_BACKUP_DAY') === today, 'Backup day not persisted');
    request({ action: 'push', baseRev: 0, force: true, payload });
    assert(backups.length === 3 && files.size === 1, 'Multiple daily backups or snapshot files');
    assert(request({ action: 'meta' }).rev === 3, 'Meta revision wrong');
    assert(request({ action: 'pull' }).payload.data === payload.data, 'Pull changed payload');
    props.set('FILE_ID', 'inaccessible');
    response = request({ action: 'pull' });
    assert(response.error === 'internal_error' && !JSON.stringify(response).includes('sensitive exception') && files.size === 1, 'Exception leaked or file replaced');
    assert(waited === released, 'Lock not released on every path');
    passed.push('Apps Script: auth, POST-only reads, locks, fixed file, server clock, conflicts, daily backups and pruning');

    const addSnapshot = (content, trashed = false) => {
      const f = file('school-dashboard-snapshot.json', content), id = 'drive-' + (++nextId);
      f.getId = () => id; f.trashed = trashed; files.set(id, f);
      return f;
    };
    const stored = JSON.stringify({ rev: 3, updatedAt: 5, payload });
    props.delete('FILE_ID'); props.set('REV', '3'); files.clear();
    response = request({ action: 'pull' });
    assert(response.error === 'file_id_missing' && files.size === 0 && !props.get('FILE_ID'), 'Pull without FILE_ID created a file');
    response = request({ action: 'push', baseRev: 3, payload });
    assert(response.error === 'file_id_missing' && files.size === 0 && !props.get('FILE_ID'), 'Push without FILE_ID created a file');

    props.delete('FILE_ID'); props.set('REV', '3'); files.clear();
    const existing = addSnapshot(stored);
    addSnapshot('{"deleted":true}', true);
    response = request({ action: 'pull' });
    assert(response.ok && response.payload.data === payload.data && props.get('FILE_ID') === existing.getId() && files.size === 2, 'Single existing snapshot was not adopted');
    props.delete('FILE_ID');
    response = request({ action: 'push', baseRev: 3, payload: { ...payload, data: 'adopted' } });
    assert(response.ok && files.size === 2 && props.get('FILE_ID') === existing.getId() && JSON.parse(existing.getBlob().getDataAsString()).payload.data === 'adopted', 'Push created a new file instead of using the single existing snapshot');

    props.delete('FILE_ID'); props.set('REV', '4'); files.clear();
    const first = addSnapshot(stored), second = addSnapshot(stored);
    for (const body of [{ action: 'pull' }, { action: 'push', baseRev: 4, payload }]) {
      response = request(body);
      assert(response.ok === false && response.error === 'multiple_files' && !props.get('FILE_ID') && files.size === 2, 'Ambiguous snapshots were guessed or a file was created for ' + body.action);
    }
    assert(first.getBlob().getDataAsString() === stored && second.getBlob().getDataAsString() === stored, 'Ambiguous snapshots were modified');
    assert(waited === released, 'Lock not released after FILE_ID migration paths');
    passed.push('Apps Script FILE_ID migration: 0 files rejected, 1 file adopted, >1 files rejected without guessing');

    const accessUi = document.createElement('div');
    accessUi.innerHTML = `<span id="headerCloudStatus"></span><span id="cloudReadOnly"></span>
      <button id="headerCloudSync"></button><div id="cloudAccessDialog" hidden>
      <span id="cloudAccessMessage"></span><div id="cloudAccessGoogle"></div>
      <button id="cloudAccessContinue"></button><button id="cloudAccessRetry"></button>
      <button id="cloudAccessSettings"></button></div>
      <select id="excTrack"><option value="">default</option><option value="רגילה">regular</option></select><div id="sadinPop"></div>`;
    document.body.appendChild(accessUi);
    let accessIdentity = null, accessDirty = false, accessPulls = 0, accessFailure = false, wipedFromAccess = false;
    const accessCloud = {
      status: { kind: 'none', text: '' }, _settingsRevision: 0,
      identity: () => accessIdentity, configured: () => !!accessIdentity,
      url: () => 'https://cloud-sync.test/exec', passcode: () => 'test-school-pass',
      hasUnpublished: () => accessDirty, meta: () => ({ syncedAt: 1 }),
      renderGoogleButton() {}, signOutGoogle() { accessIdentity = null; },
      wipeLocalSession: async () => { wipedFromAccess = true; },
      _conflict() { this.status = { kind: 'conflict' }; },
      async pushCloudState() { this._conflict(); return 'kept-local'; },
      async pullCloudState() {
        accessPulls++;
        if (accessFailure) { this.status = { kind: 'error', error: 'test offline' }; throw new Error('test offline'); }
        this.status = { kind: 'ok' };
        return 'current';
      }
    };
    const liveDoc = new Proxy(document, { get(target, key) {
      if (key === 'readyState') return 'loading';
      if (key === 'addEventListener') return (type, ...args) => {
        if (type !== 'DOMContentLoaded') target.addEventListener(type, ...args);
      };
      const value = Reflect.get(target, key);
      return typeof value === 'function' ? value.bind(target) : value;
    } });
    const accessApp = new Function('Util', 'Config', 'CloudSync', 'document', 'parseExcelFile', 'confirm', 'Store', appSource + '\nreturn App;')(
      Util, Config, accessCloud, liveDoc, async () => null, () => true, testStore
    );
    accessApp.toast = () => {};
    accessApp.hideMxPop = () => {};
    accessApp.bindEvents();
    accessApp.state.profileTz = tz;
    await accessApp.syncCloudAccess();
    assert(!document.getElementById('cloudAccessDialog').hidden && !accessApp._cloudWriteReady, 'Signed-out entry must prompt');
    accessCloud.status = { kind: 'error', error: 'ההתחברות נדחתה' };
    accessApp.renderCloudAccess();
    assert(document.getElementById('cloudAccessMessage').textContent.includes('ההתחברות נדחתה'), 'Rejected sign-in was not displayed');
    accessCloud.status = { kind: 'none' };
    document.getElementById('cloudAccessContinue').click();
    assert(document.getElementById('cloudAccessDialog').hidden && !document.getElementById('cloudReadOnly').hidden, 'Read-only choice not visible');
    const beforeAccess = JSON.stringify(Config.data), beforeRoster = Config.getRosterEntry();
    assert(!Config.setException(tz, { note: 'blocked' }).ok, 'Exception edit was not blocked');
    assert(!Config.updateRules(r => { r.passGrade = 99; }).ok, 'Rule edit was not blocked');
    assert(!Config.setRoster([row('123', 'י', 'י1')], 'blocked.csv').ok, 'Roster edit was not blocked');
    assert(JSON.stringify(Config.data) === beforeAccess && Config.getRosterEntry() === beforeRoster, 'Blocked edits mutated data');
    assert(!document.getElementById('cloudAccessDialog').hidden, 'Blocked edit did not reopen prompt');
    document.getElementById('cloudAccessContinue').click();
    const trackControl = document.getElementById('excTrack');
    trackControl.focus(); trackControl.value = 'רגילה';
    trackControl.dispatchEvent(new Event('change', { bubbles: true }));
    assert(trackControl.value === '' && JSON.stringify(Config.data) === beforeAccess, 'Blocked control did not restore its previous value');
    accessIdentity = { email: 'teacher@example.test' };
    accessFailure = true;
    await accessApp.syncCloudAccess();
    assert(accessIdentity && !accessApp._cloudWriteReady && !document.getElementById('cloudAccessDialog').hidden, 'Failed pull cleared identity or enabled edits');
    accessFailure = false; accessDirty = true;
    const pullsBeforeDirty = accessPulls;
    await accessApp.syncCloudAccess();
    assert(accessCloud.status.kind === 'conflict' && accessPulls === pullsBeforeDirty && JSON.stringify(Config.data) === beforeAccess,
      'Unpublished changes were not preserved for conflict resolution');
    await accessApp.syncCloudAccess();
    assert(accessPulls === pullsBeforeDirty, 'Sync while conflicted must not pull');
    accessDirty = false; accessCloud.status = { kind: 'none' };
    await accessApp.syncCloudAccess();
    assert(accessApp._cloudWriteReady && document.getElementById('cloudReadOnly').hidden, 'Successful pull did not enable editing');
    assert(Config.setException(tz, { note: 'allowed' }).ok, 'Authenticated edit rejected');
    accessCloud._settingsRevision++;
    assert(!accessApp.canEdit(), 'Changed cloud settings retained edit access');
    await accessApp.syncCloudAccess();
    assert(accessApp.canEdit(), 'Fresh check did not authorize changed settings');
    const savedIdb = Config._idb, beforeDataset = Config.getDataset('sadinData');
    let abortedTransaction = false;
    Config._idb = { transaction() {
      return {
        objectStore: () => ({ put: () => ({}) }),
        abort() { abortedTransaction = true; this.onabort(); }
      };
    } };
    const pendingWrite = Config.setDataset('sadinData', [{ tz, score: 11 }], 'pending.csv');
    accessIdentity = null;
    window.dispatchEvent(new Event('sd:cloud-signedout'));
    const pendingResult = await pendingWrite;
    Config._idb = savedIdb;
    assert(abortedTransaction && !pendingResult.ok && Config.getDataset('sadinData') === beforeDataset,
      'Sign-out during an IndexedDB write did not abort the pending transaction');
    accessIdentity = { email: 'teacher@example.test' };
    await accessApp.syncCloudAccess();
    const afterAllowed = JSON.stringify(Config.data);
    accessIdentity = null;
    assert(!Config.setException(tz, { note: 'expired' }).ok && JSON.stringify(Config.data) === afterAllowed,
      'Expired identity did not stop edit before mutation');
    accessApp.confirmAction = () => true;
    await accessApp.acts.cloudWipeLocal.call(accessApp);
    assert(wipedFromAccess, 'Local wipe blocked while read-only');
    accessUi.remove();
    passed.push('Read-only sign-in gate, real Config mutation guards, control restoration, failed pull, conflict and local wipe');

    results.textContent = passed.map(name => 'PASS ' + name).join('\n') + '\nAll tests passed.';
    document.title = 'PASS - Cloud sync regression tests';
  } catch (e) {
    results.textContent = passed.map(name => 'PASS ' + name).join('\n') + '\nFAIL ' + e.stack;
    document.title = 'FAIL - Cloud sync regression tests';
    console.error(e);
  } finally {
    stopTimer();
    Config._storePut = originalPut;
    Config._write = originalWrite;
    // Keep outbound traffic blocked after the tests finish.
    window.fetch = (url, options) => {
      if (new URL(url, location.href).origin !== location.origin) throw new Error('Outbound network blocked by tests');
      return localFetch(url, options);
    };
  }
})();
</script>
</html>
