<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cross-view invariants tests</title>
<pre id="results">Running...</pre>
<script>
const nativeFetch = window.fetch.bind(window);
window.fetch = (input, options) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  if (url.origin !== location.origin) throw new Error('Outbound network blocked by cross-view tests (QA-0.4)');
  return nativeFetch(input, options);
};
</script>
<script src="../js/config.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/bagrutFacts.js"></script>
<script src="../js/bagrutPolicies.js"></script>
<script src="../js/bagrutEngine.js"></script>
<script src="../js/bagrutAdvisor.js"></script>
<script src="../js/groupAnalyzer.js"></script>
<script src="../js/signalEngine.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/views/overviewView.js"></script>
<script src="../js/views/profileView.js"></script>
<script src="../js/views/groupsView.js"></script>
<script src="../js/views/sadinView.js"></script>
<script src="../js/views/bagrutView.js"></script>
<script src="../js/views/rulesView.js"></script>
<script>
(async () => {
  const results = document.getElementById('results');
  const outcome = [];
  let active = null, section = '';

  /* assertions never throw: every failure is collected so one run lists all gaps */
  const check = (condition, message) => { if (!condition) active.failures.push(`${section ? section + ': ' : ''}${message}`); };
  const same = (actual, expected, message) => check(JSON.stringify(actual) === JSON.stringify(expected), `${message} (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
  const near = (actual, expected, message) => check(typeof actual === 'number' && Math.abs(actual - expected) < 1e-9, `${message} (expected ${expected}, got ${actual})`);
  const part = async (id, fn) => {
    section = id;
    try { await fn(); } catch (e) { active.failures.push(`${id}: EXCEPTION ${e && e.stack ? e.stack : e}`); }
    section = '';
  };
  const group = async (title, fn) => {
    active = { title, failures: [] };
    outcome.push(active);
    try { await fn(); } catch (e) { active.failures.push(`EXCEPTION ${e && e.stack ? e.stack : e}`); }
  };
  const tick = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));

  /* ---------- synthetic data helpers (100% invented IDs and names) ---------- */
  const T = n => String(900000000 + n);
  const stu = (n, grade, homeroom, extra = {}) => ({ tz: T(n), firstName: 'חניך' + n, lastName: 'בדיקה', grade, homeroom, track: 'רגילה', ...extra });
  const BAGRUT_MAP = { tz: 'tz', subject: 'subject', questionnaireCode: 'code', finalGrade: 'final', examGrade: 'exam', submissionGrade: 'sub', moed: 'moed' };
  const GROUP_MAP = { tz: 'tz', grade: 'grade', classNum: 'cls', groupId: 'gid', isTeacher: 'teacher' };
  const SADIN_MAP = { tz: 'tz', event: 'ev', score: 'sc', group: 'grp', date: 'dt' };
  const bagrutRows = list => Parser.normalize('bagrut', list, BAGRUT_MAP).rows;
  const groupRows = list => Parser.normalize('groups', list, GROUP_MAP).rows;
  const sadinRows = list => Parser.normalize('grades', list, SADIN_MAP).rows;

  const BASE = {
    '22283': 70, '22261': 70, '34221': 70, '34225': 70, '8283': 70, '8281': 70, '1263': 70, '1264': 70, '11283': 70, '11281': 70,
    '16382': 80, '16471': 80, '16483': 80, '16486': 80, '35471': 80, '35472': 80, '36361': 80,
    '86083': 'עמד בדרישות', '41083': 'בוצע', '43183': 70, '82083': 'בוצע'
  };
  const profile = (tz, changes = {}) => Object.entries({ ...BASE, ...changes }).filter(([, value]) => value !== null)
    .map(([code, value]) => (typeof value === 'object' ? { tz, code, ...value } : { tz, code, final: value }));
  const partial = (n, map) => Object.entries(map).map(([code, final]) => ({ tz: T(n), code, final }));
  const ELEVENTH = { '22283': 70, '34221': 70, '8283': 70, '1263': 70, '11283': 70, '16382': 70, '35471': 70 };
  const FULL = { ignoreInternals: false, plus5: false, useCurrent: false, fullMode: true };
  const ADAPTIVE = { ignoreInternals: false, plus5: false, useCurrent: false, fullMode: false };

  /* ---------- isolated persistence: nothing touches the browser's real localStorage / IndexedDB ---------- */
  const storage = new Map();
  let saved = null, appSource = null;
  const resetConfig = () => {
    storage.clear();
    Config.data = Config.defaults();
    Config._activeCohort = Config.data.gradeCohortMap['12'];
    Config._rulesOverride = null;
    Config._syncQuestionnaires();
    Config._cache = {};
    Config._ignoredCache = new Set();
    Config._invalidateRoster();
  };
  const world = ({ roster = [], bagrut = [], groups = [], sadin = [] } = {}) => {
    const norm = Config.normalizeRosterRows(roster);
    const stamp = Date.now();
    const cache = {};
    if (roster.length) cache.masterRoster = { data: norm.rows, ignoredIds: norm.ignoredIds, fileName: 'synthetic-roster.xlsx', uploadedAt: stamp };
    [['bagrutData', bagrut], ['groupsData', groups], ['sadinData', sadin]].forEach(([key, rows]) => {
      if (rows.length) cache[key] = { data: rows, fileName: `synthetic-${key}.xlsx`, uploadedAt: stamp };
    });
    Config._cache = cache;
    Config._ignoredCache = new Set();
    storage.delete(Config.KEYS.masterRoster);
    if (cache.masterRoster) Config._write(Config.KEYS.masterRoster, cache.masterRoster);
    Config._invalidateRoster();
    Store.refresh();
    return norm;
  };

  /* ---------- the real App object, loaded the same way as tests/cloud-sync.html (no boot, no network) ---------- */
  const parsed = {};
  const makeApp = () => {
    const doc = new Proxy(document, { get(target, key) {
      if (key === 'readyState') return 'loading';
      if (key === 'addEventListener') return () => {};
      const value = Reflect.get(target, key);
      return typeof value === 'function' ? value.bind(target) : value;
    } });
    const cloud = { configured: () => false, hasUnpublished: () => false, status: { kind: 'none' }, meta: () => ({ syncedAt: 0, dirty: false, rev: 0 }), url: () => '', passcode: () => '' };
    const instance = new Function('Util', 'Config', 'CloudSync', 'document', 'parseExcelFile', 'confirm', 'Store', appSource + '\nreturn App;')(
      Util, Config, cloud, doc, async (file, type) => parsed[type], () => true, Store
    );
    instance.toasts = [];
    instance.toast = (message, kind) => { instance.toasts.push({ message, kind }); };
    instance.state.sim = { ...FULL };
    instance.state.bagrutScope = 'all';
    instance.state.bagrutScopeSet = true;
    return instance;
  };
  const MOUNT = `<div id="mainContent"></div>
    <div id="bagrut-kpis"></div><select id="bagrutSubjectDrillSelect"></select><div id="bagrut-whatif"></div><div id="bagrut-cohort"></div><div id="bagrut-table"></div>
    <div id="overview-body"></div>
    <select id="sadinSubjectSelect"></select><select id="sadinTeacherSelect"></select><select id="sadinFilterSelect"></select><div id="sadin-table"></div>
    <div id="groups-head"><div id="groups-mode"></div></div><div id="groups-kpis"></div><div id="groups-table"></div><div id="groups-strip"></div><div id="groups-master"></div><div id="groups-detail"></div><select id="groupSubjectSelect"></select><select id="groupTeacherSelect"></select>
    <select id="profSelect"></select><div id="profName"></div><div id="profMeta"></div><div id="profBadges"></div><div id="profKpis"></div><div id="profBody"></div>
    <button id="profPrev"></button><button id="profNext"></button><span id="profPos"></span><button id="profBack"></button><select id="excTrack"></select><textarea id="excNote"></textarea><button id="excOpen"></button>`;
  const mount = () => {
    let stage = document.getElementById('stage');
    if (!stage) { stage = document.createElement('div'); stage.id = 'stage'; document.body.appendChild(stage); }
    const modal = document.getElementById('modal-root');
    if (modal) modal.innerHTML = '';
    stage.innerHTML = MOUNT;
    return stage;
  };
  const $id = id => document.getElementById(id);
  const stageText = () => $id('stage').textContent + ($id('modal-root') ? $id('modal-root').textContent : '');
  const noGarbage = label => check(!/\b(NaN|undefined|Infinity)\b/.test(stageText()), `${label}: NaN/undefined/Infinity leaked into the screen`);
  const newApp = filters => {
    const instance = makeApp();
    instance.state.filters = { grade: 'all', cls: 'all', track: 'all', q: '', ...(filters || {}) };
    mount();
    return instance;
  };
  const errorsOf = instance => instance.toasts.filter(t => /שגיאה בהצגת הפאנל/.test(t.message));

  /* ---------- DOM readers ---------- */
  const rowFor = (table, tz) => { const b = [...table.querySelectorAll('button[data-act="openProfile"]')].find(x => x.dataset.tz === tz); return b ? b.closest('tr') : null; };
  const colIndex = (table, label) => [...table.querySelectorAll('thead th')].findIndex(th => th.textContent.trim().includes(label));
  const cellOf = (table, tz, label) => { const tr = rowFor(table, tz), i = colIndex(table, label); return tr && i >= 0 ? tr.children[i] : null; };
  const tzsIn = table => [...new Set([...table.querySelectorAll('button[data-act="openProfile"][data-tz]')].map(b => b.dataset.tz))].sort();
  const kpiCounts = () => [...$id('bagrut-kpis').querySelectorAll('button.gstat[data-chip]')].map(b => ({ value: b.dataset.chip, n: Number(b.querySelector('span:last-child').textContent) }));
  const optionCounts = select => [...select.options].map(o => ({ value: o.value, n: Number((/\((\d+)\)\s*$/.exec(o.textContent) || [])[1]) }));
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const trackOfStudent = t => Config.trackFor(t.tz, t.track, t.classKey);

  /* ---------- rich synthetic school: tracks, special-ed class, exceptions, groups and sadin ---------- */
  const schoolFixture = () => {
    const roster = [], bagrut = [], groups = [], sadin = [];
    const add = (n, grade, cls, rows, extra) => { roster.push(stu(n, grade, cls, extra)); if (rows) bagrut.push(...bagrutRows(rows)); };
    add(1, 'יב', 'יב1', profile(T(1)));
    add(2, 'יב', 'יב1', profile(T(2), { '22283': 50, '22261': 50 }), { track: 'אתגר' });
    add(3, 'יב', 'יב1', profile(T(3), { '22283': 30, '22261': 30, '16382': 75, '16471': 75, '35471': 75, '35472': 75 }), { track: 'מב"ר' });
    add(4, 'יב', 'יב1', profile(T(4), { '11283': 50, '11281': 50 }), { track: 'חנ"מ' });
    add(5, 'יב', 'יב2', profile(T(5), { '22283': 30, '22261': 30, '34221': 30, '34225': 30 }));
    add(6, 'יב', 'יב2', profile(T(6), { '22283': null, '22261': 60 }));
    add(7, 'יב', 'יב2', profile(T(7), { '22283': null, '22261': 20 }));
    add(8, 'יב', 'יב2', profile(T(8), { '35571': 80, '35471': 60, '35472': 70 }));
    add(9, 'יב', 'יב3', profile(T(9)));
    add(10, 'יב', 'יב3', profile(T(10), { '22283': 30, '22261': 30, '34221': 30, '34225': 30 }));
    add(11, 'יב', 'יב2', null);
    add(12, 'יב', 'יב2', profile(T(12)));
    add(13, 'יב', 'יב2', profile(T(13), { '22283': 30, '22261': 30, '34221': 30, '34225': 30 }));
    add(14, 'יב', 'יב1', profile(T(14)), { track: 'אתגר' });
    for (let n = 21; n <= 27; n++) add(n, 'יא', n < 25 ? 'יא1' : 'יא2', partial(n, ELEVENTH), n === 24 ? { track: 'מב"ר' } : {});
    add(28, 'יא', 'יא2', partial(28, { ...ELEVENTH, '16382': undefined }).filter(r => r.final !== undefined));
    add(29, 'יא', 'יא2', partial(29, { ...ELEVENTH, '16382': undefined, '35471': undefined }).filter(r => r.final !== undefined));
    add(31, 'י', 'י1', null);
    add(32, 'י', 'י1', partial(32, { '16381': 60, '16382': 60 }));
    add(33, 'י', 'י2', partial(33, { '16381': 30 }));
    const math = 'מתמטיקה 4 יח"ל יב1-יב2 דוד בדיקה [9001]', english = 'אנגלית 4 יח"ל יב1 מיכל בדיקה [9101]';
    groups.push(...groupRows([
      ...[1, 2, 3, 4, 5, 6, 7, 8].map(n => ({ tz: T(n), grade: 'יב', cls: n < 5 ? 'יב1' : 'יב2', gid: math })),
      { tz: T(900), gid: math, teacher: 'כן' }
    ]));
    sadin.push(...sadinRows([
      { tz: T(1), ev: 'מבחן א (50)', sc: 40, grp: math, dt: '01/10/2026' }, { tz: T(1), ev: 'מבחן ב (50)', sc: 40, grp: math, dt: '08/10/2026' },
      { tz: T(1), ev: 'מבחן א (50)', sc: 40, grp: english, dt: '01/10/2026' }, { tz: T(1), ev: 'מבחן ב (50)', sc: 40, grp: english, dt: '08/10/2026' },
      { tz: T(2), ev: 'מבחן א (50)', sc: 80, grp: math, dt: '01/10/2026' }, { tz: T(2), ev: 'מבחן ב (50)', sc: 80, grp: math, dt: '08/10/2026' },
      { tz: T(3), ev: 'מבחן א (50)', sc: 80, grp: math, dt: '01/10/2026' }, { tz: T(3), ev: 'מבחן ב (50)', sc: 80, grp: math, dt: '08/10/2026' }
    ]));
    return { roster, bagrut, groups, sadin };
  };
  const applySchoolConfig = () => {
    Config.setSpecialEdClass('יב3', true);
    Config.setException(T(1), { trackOverride: 'חנ"מ' });
    Config.setException(T(12), { isException: true, overrideStatus: 'twelve', reason: 'מסלול 12 שנות לימוד סינתטי' });
    Config.setException(T(13), { isException: true, overrideStatus: 'eligible', reason: 'החלטה סינתטית' });
    Config.setRosterOverride(T(31), { track: 'חנ"מ' });
    Store.refresh();
  };
  const EXPECTED_TRACK = { [T(1)]: 'חנ"מ', [T(2)]: 'אתגר', [T(3)]: 'מב"ר', [T(4)]: 'חנ"מ', [T(9)]: 'חנ"מ', [T(10)]: 'חנ"מ', [T(14)]: 'אתגר', [T(24)]: 'מב"ר', [T(31)]: 'חנ"מ' };
  const expectedTrack = tz => EXPECTED_TRACK[tz] || 'רגילה';
  const tallies = list => {
    const counted = list.filter(x => x.ev.tier !== 5 && x.ev.tier !== 0);
    const ok = x => x.ev.tier === 1 || x.ev.tier === 2;
    const special = x => trackOfStudent(x.t) === 'חנ"מ';
    const noSpecial = counted.filter(x => !special(x));
    return {
      total: list.length, counted: counted.length, noBagrut: list.filter(x => x.ev.tier === 0).length, twelve: list.filter(x => x.ev.tier === 5).length,
      specialEd: list.filter(special).length, incl: pct(counted.filter(ok).length, counted.length), ex: pct(noSpecial.filter(ok).length, noSpecial.length),
      exceptions: list.filter(x => x.ev.manual).length
    };
  };

  try {
    await Config.ready;
    saved = {
      data: Config.data, cache: Config._cache, ignored: Config._ignoredCache, active: Config._activeCohort, override: Config._rulesOverride,
      write: Config._write, read: Config._read, put: Config._storePut, cleared: Config.setRosterCleared, raw: Store.raw, loaded: Store.loaded
    };
    Config._write = (key, value) => { storage.set(key, JSON.stringify(value)); return { ok: true }; };
    Config._read = key => { const raw = storage.get(key); return raw ? JSON.parse(raw) : null; };
    Config._storePut = async () => ({ ok: true });
    Config.setRosterCleared = () => {};
    resetConfig();
    appSource = await (await window.fetch('../js/app.js')).text();

    /* ====================================================================
       קבוצה 0 — חסימת רשת (QA-0.4)
       ==================================================================== */
    await group('Group 0 — QA-0.4 outbound cloud traffic is blocked', async () => {
      await part('QA-0.4', async () => {
        let blocked = false;
        try { window.fetch('https://script.google.com/macros/s/synthetic/exec', { method: 'POST', body: '{}' }); } catch (e) { blocked = /blocked/.test(e.message); }
        check(blocked, 'fetch to script.google.com must throw synchronously');
      });
    });

    /* ====================================================================
       קבוצה A — מסלולים, חריגים, דריסות וכיול כללים
       QA-4.2, QA-5.2, QA-6.3, QA-6.5, QA-7.6, QA-8.1, QA-8.2
       ==================================================================== */
    await group('Group A — tracks, exceptions, overrides, rule calibration: QA-4.2, QA-5.2, QA-6.3, QA-6.5, QA-7.6, QA-8.1, QA-8.2', async () => {
      await part('QA-4.2 coordinator decision with a reason: immediate, persisted, identical after reload and backup', async () => {
        resetConfig();
        const app = newApp();
        const tz = T(1);
        world({ roster: [stu(1, 'יב', 'יב1')], bagrut: bagrutRows(profile(tz, { '22283': 30, '22261': 30, '34221': 30, '34225': 30 })) });
        app.evals.clear();
        const before = JSON.stringify(BagrutEngine.evaluate(tz, app.state.sim));
        check(app.getEval(tz).tier === 4 && !app.getEval(tz).manual, 'Precondition: two failing subjects are tier 4');
        app.openExceptionModal(tz);
        check($id('xmIs') && $id('xmStatus') && $id('xmReason'), 'The exception form must open');
        $id('xmIs').checked = true; $id('xmStatus').value = 'eligible'; $id('xmReason').value = '  החלטה סינתטית: הקלות  ';
        app.acts.excModalSave.call(app, { dataset: { tz } });
        app.evals.clear();
        const decided = app.getEval(tz);
        check(decided.manual && decided.tier === 1 && decided.exceptionReason === 'החלטה סינתטית: הקלות', 'The decision must take effect immediately in the engine');
        const stored = JSON.parse(storage.get(Config.KEYS.config) || '{}');
        check(stored.traineeExceptions && stored.traineeExceptions[tz] && stored.traineeExceptions[tz].reason === 'החלטה סינתטית: הקלות' && stored.traineeExceptions[tz].overrideStatus === 'eligible', 'The decision must be persisted with its reason');

        const exceptionBefore = JSON.stringify(Config.getException(tz)), evalBefore = JSON.stringify(BagrutEngine.evaluate(tz, app.state.sim));
        const keep = { ...Config._cache };
        Config.load();
        Object.keys(keep).forEach(key => { if (key !== 'masterRoster') Config._cache[key] = keep[key]; });
        Store.refresh();
        check(JSON.stringify(Config.getException(tz)) === exceptionBefore && JSON.stringify(BagrutEngine.evaluate(tz, app.state.sim)) === evalBefore, 'After a reload the decision and the engine result must be identical');

        const backup = JSON.stringify(Config.exportObject());
        check(backup.includes('החלטה סינתטית: הקלות'), 'The backup must contain the decision');
        Config.data.traineeExceptions = {};
        await Config.importJSON(backup, { silent: true });
        check(JSON.stringify(Config.getException(tz)) === exceptionBefore && JSON.stringify(BagrutEngine.evaluate(tz, app.state.sim)) === evalBefore, 'Restoring the backup must bring the decision back unchanged');
        app.acts.excModalClear.call(app, { dataset: { tz } });
        check(JSON.stringify(BagrutEngine.evaluate(tz, app.state.sim)) === before, 'Removing the decision must restore the original engine result');
        check(errorsOf(app).length === 0, 'No panel error');
      });

      await part('QA-5.2 weight change 30/70 -> 40/60 updates grade and status in engine, advisor and screens', async () => {
        resetConfig();
        const app = newApp();
        const tz = T(1);
        world({ roster: [stu(1, 'יב', 'יב1')], bagrut: bagrutRows(profile(tz, { '22283': 40, '22261': 63 })) });
        app.evals.clear();
        const history = () => { const ev = app.getEval(tz); return { ev, s: ev.subjects.find(x => x.id === 'history') }; };
        const first = history();
        near(first.s.final, 56.1, 'Final with weights 30/70');
        check(first.s.status === 'pass' && first.ev.tier === 1 && first.ev.cells.history.text === '56', 'Before: pass, tier 1, advisor cell 56');
        app.renderBagrutPanel();
        check(cellOf($id('bagrut-table'), tz, 'היסטוריה').textContent.trim() === '56', 'Before: the eligibility table must show 56');
        const res = Config.updateRules(r => { const h = r.coreSubjects.find(s => s.id === 'history'); h.components[0].weight = 40; h.components[1].weight = 60; });
        check(res.ok, 'The weight change must be accepted');
        app.evals.clear();
        const second = history();
        near(second.s.final, 53.8, 'Final with weights 40/60');
        check(second.s.status === 'comp' && second.ev.tier === 2 && second.ev.cells.history.text === '54' && second.ev.cells.history.sub === 'קיזוז', 'After: compensation (tier 2) with advisor cell 54 / קיזוז');
        check(BagrutEngine.evaluate(tz, FULL).tier === 2, 'A fresh engine evaluation must agree');
        app.renderBagrutPanel();
        const cell = cellOf($id('bagrut-table'), tz, 'היסטוריה');
        check(cell && /54/.test(cell.textContent) && /קיזוז/.test(cell.textContent), 'After: the eligibility table must show 54 + קיזוז');
        app.state.profileTz = tz;
        app.renderTrainee360Panel();
        check(/קיזוז/.test($id('profBody').textContent), 'After: the 360 card must mention the compensation');
      });

      await part('QA-6.3 passGrade 55 -> 60 on a borderline 57: one consistent change across engine, advisor, sadin, control room', async () => {
        resetConfig();
        const app = newApp();
        const g = 'היסטוריה יב1 דוד בדיקה [7001]';
        world({
          roster: [stu(1, 'יב', 'יב1'), stu(2, 'יב', 'יב1'), stu(3, 'יב', 'יב1')],
          bagrut: bagrutRows([...profile(T(1), { '22283': 57, '22261': 57 }), ...profile(T(2)), ...profile(T(3))]),
          sadin: sadinRows([[1, 57], [2, 80], [3, 80]].flatMap(([n, sc]) => [{ tz: T(n), ev: 'מבחן א (50)', sc, grp: g, dt: '01/10/2026' }, { tz: T(n), ev: 'מבחן ב (50)', sc, grp: g, dt: '08/10/2026' }]))
        });
        app.evals.clear();
        const overviewPct = () => app.overviewModel().stats.eligibilityInclSpecialEd;
        app.state.sadin.mode = 'full';
        const snapshot = () => {
          app.evals.clear();
          const ev = app.getEval(T(1)), s = ev.subjects.find(x => x.id === 'history');
          app.renderBagrutPanel();
          const bagrutCell = cellOf($id('bagrut-table'), T(1), 'היסטוריה');
          app.renderSadinPanel();
          const sadinRow = rowFor($id('sadin-table'), T(1));
          const sheetRow = GroupAnalyzer.sadinSheet([Store.trainees.get(T(1))], {})[0];
          return {
            status: s.status, tier: ev.tier, cell: ev.cells.history.state, focus: ev.focus.length,
            tableAlert: !!(bagrutCell && bagrutCell.querySelector('.score-alert')), pct: overviewPct(),
            eligibleChip: kpiCounts().find(o => o.value === 'eligible').n,
            status360: app.profileSubjectStatus(s), sadinFailing: sheetRow.failing, sadinBad: !!(sadinRow && sadinRow.querySelector('.sx-avg .sadin-score.is-bad'))
          };
        };
        const before = snapshot();
        check(before.status === 'pass' && before.tier === 1 && before.pct === 100 && before.eligibleChip === 3 && !before.tableAlert && /עובר/.test(before.status360), 'Precondition at passGrade 55');

        const everyone = app.subjectReadinessModel('core:history', app.filtered(), false);
        same([everyone.rows.length, everyone.notEnrolled, everyone.noGrade, everyone.unreported, everyone.total], [10, 8, 0, 0, 2], '8 ungrouped pupils are notEnrolled');
        same(everyone.rows.filter(r => r.readiness === 'notEnrolled').map(r => r.t.tz).sort(), [3, 4, 5, 6, 7, 8, 9, 10].map(T), 'Exactly the ungrouped pupils');
        const pending = app.subjectReadinessModel('core:history', app.filtered(), true);
        same([pending.rows.map(r => r.t.tz).sort(), pending.notEnrolled, pending.offTrack], [[T(1), T(2)], 0, 1], 'Pending examinees are only the completion group');
        app.renderOverviewPanel();
        const card = app.overviewReadinessModel(app.overviewModel()).items.find(r => r.sel === 'core:history');
        check(card && card.total === 2 && card.unreported === 0, 'No eight unreported pupils in the overview model');
        Object.assign(app.state.bagrut, { drill: 'core:history', onlyPending: false, readinessFilter: 'all', readinessClass: '' });
        app.state.sim.useCurrent = true;
        app.renderBagrutPanel();
        same([...$id('bagrut-table').querySelectorAll('[data-readiness="notEnrolled"]')].map(c => c.textContent.trim()), Array(8).fill('—'), 'All-pupils view shows dashes for notEnrolled');
        check(!$id('bagrut-kpis').textContent.includes('טרם דווח'), 'Strip has no unreported count');
        same(errorsOf(app), [], 'No vault errors');
      });

      await part('Grade 11 subject taught this year appears despite its 30% being in the grade-12 vault', async () => {
        resetConfig();
        const g = 'היסטוריה יא1 דוד [7301]';
        Config.withRulesForGrade('יא', () => Config.rules().coreSubjects.find(s => s.id === 'history').components.forEach(c => { c.expectedGrade = 'יב'; }));
        world({
          roster: [1, 2, 3].map(n => stu(n, 'יא', 'יא1')),
          bagrut: bagrutRows([1, 2, 3].flatMap(n => partial(n, { '16382': 70 }))),
          groups: groupRows([1, 2, 3].map(n => ({ tz: T(n), grade: 'יא', cls: 'יא1', gid: g }))),
          sadin: sadinRows([[1, 70], [2, 60], [3, 40]].map(([n, sc]) => ({ tz: T(n), ev: 'מבחן (100)', sc, grp: g, dt: '01/10/2026' })))
        });
        const app = newApp({ grade: 'יא' });
        const ov = app.overviewReadinessModel(app.overviewModel());
        const history = ov.items.find(r => r.sel === 'core:history');
        check(history && history.total === 3 && history.offTrack === 2, 'Enrolled grade-11 history is an active readiness subject');
        check(![...ov.items, ...ov.unreportedItems].some(r => r.sel === 'core:english'), 'Subjects without enrolled groups are not candidates');
        same(errorsOf(app), [], 'No grade-11 vault errors');
      });

      await part('Grade-cohort schedules, empty schedules and unloading clear stale readiness', async () => {
        build();
        const app = newApp({ grade: 'יא' });
        const rules11 = Config.withRulesForGrade('יא', () => Config.rules());
        const history = rules11.coreSubjects.find(s => s.id === 'history');
        const oldGrades = history.components.map(c => c.expectedGrade);
        history.components.forEach(c => { c.expectedGrade = 'יא'; });
        const scheduled = m => [...m.items, ...m.unreportedItems];
        check(scheduled(app.overviewReadinessModel(app.overviewModel())).some(r => r.sel === 'core:history'), 'Selected grade uses its own scheduled components');
        history.components.forEach((c, i) => { c.expectedGrade = oldGrades[i]; });
        const schedule = scheduled(app.overviewReadinessModel(app.overviewModel()));
        check(!schedule.some(r => r.sel === 'core:history') && schedule.some(r => r.sel === 'core:english'), 'Grade 11 is not forced to grade 12 schedule');
        app.renderOverviewPanel();
        app.acts.ovReadiness.call(app, readinessAction('core:english', '11'));
        same([app.state.filters.grade, app.state.bagrut.drill], ['יא', 'core:english'], 'Grade 11 readiness navigation');
        Config.withRulesForGrade('יא', () => {
          const rules = Config.rules();
          rules.coreSubjects.forEach(s => (s.variableUnits ? Object.values(s.levels).flat() : s.components).forEach(c => { c.expectedGrade = 'יב'; }));
          rules.majors.forEach(s => { s.expectedGrade = 'יב'; });
        });
        app.renderOverviewPanel();
        const empty = app.overviewReadinessModel(app.overviewModel());
        check(!empty.items.length && !empty.unreportedItems.length && empty.message.includes('אין שאלוני'), 'No matching schedule clears rows and explains');
        world({ roster: fixture().roster });
        app.renderOverviewPanel(); app.renderBagrutPanel();
        const unloaded = app.overviewReadinessModel(app.overviewModel());
        check(!unloaded.items.length && !unloaded.unreportedItems.length && unloaded.message.includes('טען ציונים שוטפים'), 'Unloading clears overview readiness');
        check(!$id('bagrut-table').querySelector('[data-readiness]'), 'No stale current column after unloading');
        noGarbage('empty readiness');
      });

      await part('Automatically scheduled custom subjects remain open after overview navigation', async () => {
        build();
        check(Config.addClause('core', { id: 'readiness_test', name: 'מקצוע בדיקה', keywords: ['מקצוע בדיקה'], units: 2,
          components: [{ codes: ['987654'], weight: 100, expectedGrade: 'יב', enabled: true }] }).ok, 'Add a scheduled custom core subject');
        const app = newApp();
        app.renderOverviewPanel();
        const model = app.overviewReadinessModel(app.overviewModel());
        const row = [...model.items, ...model.unreportedItems].find(r => r.sel === 'core:readiness_test');
        check(!!row, 'Automatically found custom subject');
        app.acts.ovReadiness.call(app, readinessAction('core:readiness_test'));
        same(app.state.bagrut.drill, 'core:readiness_test', 'Advisor default drill options must not reset an active scheduled subject');
        same($id('bagrutSubjectDrillSelect').value, 'core:readiness_test', 'Selected subject remains visible in drill selector');
        const summary = $id('bagrut-kpis').querySelector('[data-readiness-summary]');
        same([Number(summary.dataset.total), Number(summary.dataset.offTrack)], [row.total, row.offTrack], 'Custom subject overview/matrix parity');
        same(errorsOf(app), [], 'No custom-subject navigation errors');
      });
    });
  } catch (e) {
    outcome.push({ title: 'Test harness', failures: [`EXCEPTION ${e && e.stack ? e.stack : e}`] });
  } finally {
    const stage = document.getElementById('stage'), modal = document.getElementById('modal-root');
    if (stage) stage.remove();
    if (modal) modal.remove();
    if (saved) {
      Config.data = saved.data; Config._cache = saved.cache; Config._ignoredCache = saved.ignored; Config._activeCohort = saved.active;
      Config._rulesOverride = saved.override; Config._write = saved.write; Config._read = saved.read; Config._storePut = saved.put;
      Config.setRosterCleared = saved.cleared; Store.raw = saved.raw; Store.loaded = saved.loaded; Config._invalidateRoster();
    }
  }

  const failed = outcome.filter(g => g.failures.length);
  results.textContent = outcome.map(g => (g.failures.length ? `FAIL ${g.title}\n${g.failures.map(f => '  - ' + f).join('\n')}` : `PASS ${g.title}`)).join('\n') +
    (failed.length ? `\n${failed.length} of ${outcome.length} groups failed.` : '\nAll tests passed.');
  document.title = failed.length ? 'FAIL - Cross-view invariants tests' : 'PASS - Cross-view invariants tests';
})();
</script>
